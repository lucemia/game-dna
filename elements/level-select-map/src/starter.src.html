<script>
/* Gullwing Trail: a level-select map game built on GameDNA_LevelMap (B-05). Title -> map -> level -> map ... -> Storm Keep -> ending.
   Sections are marked "=== n." (see starter/README.md). Addons plug in through the ADDONS SLOT after this script. */
(function () {
  'use strict';
  // =================================================================== 1. Config and content
  const W = 256, H = 224, TS = 16, ROWS = 13, OY = 16, STEP_MS = 1000 / 60;   // HUD band = top 16 px, level = 13 rows below it
  const Q = new URLSearchParams(location.search);
  const HAS_T = Q.has('t'), FREEZE = Q.get('freeze') === '1', T0 = Math.max(0, +Q.get('t') || 0);
  const SEED = (Number(Q.get('seed')) || 20261117) >>> 0;
  const TEST = HAS_T || Q.get('auto') === '1' || Q.has('seed') || Q.has('level');   // test runs never touch the saved game
  const SAVE_KEY = 'gullwing-trail-save-v1';

  // The overworld graph (map px). kind: start | level | secret | bonus | hut | shop | castle. exit 'secret' = opened by the key.
  const MAP_NODES = [
    { id: 'trail', x: 24, y: 206, kind: 'start', name: 'Trailhead' },
    { id: 'gull', x: 64, y: 180, kind: 'level', name: 'Gull Steps' },
    { id: 'tide', x: 112, y: 200, kind: 'secret', name: 'Tide Caves' },
    { id: 'seal', x: 152, y: 240, kind: 'bonus', name: 'Seal Cove' },
    { id: 'lamp', x: 150, y: 154, kind: 'hut', name: 'Lamp Hut' },
    { id: 'windy', x: 196, y: 130, kind: 'level', name: 'Windy Ledge' },
    { id: 'tent', x: 236, y: 174, kind: 'shop', name: 'Pedlar Tent' },
    { id: 'ridge', x: 256, y: 92, kind: 'level', name: 'Ridge Run' },
    { id: 'keep', x: 322, y: 62, kind: 'castle', name: 'Storm Keep' }
  ];
  const MAP_EDGES = [
    { a: 'trail', b: 'gull', via: [[40, 198]] }, { a: 'gull', b: 'tide', via: [[90, 184]] },
    { a: 'tide', b: 'lamp', via: [[130, 172]] }, { a: 'tide', b: 'seal', exit: 'secret', via: [[122, 226], [138, 240]] },
    { a: 'seal', b: 'tent', via: [[200, 240], [226, 204]] },
    { a: 'lamp', b: 'windy', via: [[172, 142]] }, { a: 'windy', b: 'tent', via: [[222, 150]] },
    { a: 'windy', b: 'ridge', via: [[216, 104]] }, { a: 'ridge', b: 'keep', via: [[288, 80]] }
  ];

  // Level chunks: 13 rows each (row 10 = ground surface). '#' ground, '=' stone ledge, 'o' coin, 'k' key, 'h' heart,
  // 'c' crab, 'g' gull, 'G' goal flag, 'B' the warden (boss). Chunks only use gaps <= 3 tiles and steps <= 2 (the autopilot can clear them).
  const CH = {
    flat: ['........', '........', '........', '........', '........', '........', '........', '........', '........', '.oooo...', '########', '########', '########'],
    pit2: ['........', '........', '........', '........', '........', '...oo...', '..o..o..', '........', '........', '........', '###..###', '###..###', '###..###'],
    pit3: ['.........', '.........', '.........', '.........', '.........', '...ooo...', '..o...o..', '.........', '.........', '.........', '###...###', '###...###', '###...###'],
    step: ['........', '........', '........', '........', '........', '.....oo.', '........', '......c.', '....####', '....####', '########', '########', '########'],
    down: ['........', '........', '........', '........', '........', '.oo.....', '........', '........', '####....', '####..o.', '########', '########', '########'],
    ledge: ['............', '............', '............', '............', '............', '............', '...o....o...', '.....oo.....', '............', '............', '###..==..###', '###..==..###', '###..==..###'],
    crab: ['........', '........', '........', '........', '........', '........', '...oo...', '........', '........', '.....c..', '########', '########', '########'],
    crab2: ['............', '............', '............', '............', '............', '............', '..oo....oo..', '............', '............', '...c.....c..', '############', '############', '############'],
    gull: ['........', '........', '........', '........', '........', '.....g..', '........', '........', '........', '.oo..oo.', '########', '########', '########'],
    gullc: ['..........', '..........', '..........', '..........', '......g...', '..........', '..........', '..........', '..ooo.....', '..........', '##########', '##########', '##########'],
    key: ['........', '........', '........', '........', '........', '........', '........', '....k...', '........', '.o....o.', '########', '########', '########'],
    heart: ['........', '........', '........', '........', '........', '........', '..o..o..', '........', '........', '....h...', '########', '########', '########'],
    coins: ['..........', '..........', '..........', '..........', '..........', '...oooo...', '..o....o..', '..........', '..........', '..........', '##########', '##########', '##########'],
    goal: ['..........', '..........', '..........', '..........', '..........', '..........', '..........', '..........', '..........', '......G...', '##########', '##########', '##########'],
    arena: ['####................####', '####................####', '........................', '........................', '........................', '...........ooooo........', '...........=====........', '........................', '........................', '...............B........', '########################', '########################', '########################']
  };
  const LEVELS = {
    gull: { name: 'Gull Steps', theme: 'day', chunks: ['flat', 'crab', 'flat', 'pit2', 'gull', 'step', 'down', 'crab2', 'heart', 'pit2', 'gullc', 'crab', 'goal'] },
    tide: { name: 'Tide Caves', theme: 'cave', chunks: ['flat', 'crab', 'pit2', 'key', 'ledge', 'gull', 'step', 'down', 'crab2', 'pit3', 'gullc', 'flat', 'goal'] },
    seal: { name: 'Seal Cove', theme: 'day', chunks: ['flat', 'coins', 'pit2', 'coins', 'ledge', 'coins', 'crab', 'goal'] },
    windy: { name: 'Windy Ledge', theme: 'dusk', chunks: ['flat', 'gull', 'pit2', 'step', 'crab2', 'down', 'ledge', 'gullc', 'heart', 'pit3', 'crab', 'flat', 'goal'] },
    ridge: { name: 'Ridge Run', theme: 'dusk', chunks: ['flat', 'crab2', 'gull', 'pit3', 'step', 'crab', 'down', 'ledge', 'gullc', 'pit2', 'heart', 'crab2', 'gull', 'goal'] },
    keep: { name: 'Storm Keep', theme: 'storm', chunks: ['flat', 'crab', 'arena'], boss: true }
  };
  const SHOP = { name: 'Pedlar Tent', item: 'HEART', price: 10 };

  // =================================================================== 2. Game object (public surface, see README)
  const canvas = document.getElementById('screen'), ctx = canvas.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
  let rngState = SEED;
  function rand() { rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0; return rngState / 4294967296; }
  const GAME = window.GAME = {
    W, H, addons: [], scene: 'title', map: null, L: null,
    run: { lives: 3, coins: 0, best: {}, keys: {}, saves: 0, deaths: 0, levelsPlayed: 0, startFrame: 0 },
    flags: { builtinPopups: true, builtinShake: true },
    autoplay: { on: HAS_T || Q.get('auto') === '1', decide: null },
    clock: { frame: 0, levelFrame: 0, paused: false, hitStop: 0 },
    applyHit: ev => applyHit(ev),
    uiRects: () => uiRects(), anchor: id => anchor(id), units: () => units(),
    pause: on => { GAME.clock.paused = !!on; },
    hitStop: f => { const n = typeof f === 'object' && f ? Math.ceil((f.ms || 0) / STEP_MS) : Math.max(0, f | 0); GAME.clock.hitStop = Math.max(GAME.clock.hitStop, n); },
    hitStopMs: ms => GAME.hitStop({ ms }),
    shake: (px, frames) => { if (reduced) return; fx.shake = Math.max(fx.shake, px | 0); fx.shakeT = Math.max(fx.shakeT, frames | 0); },
    flash: (color, frames, alpha) => { if (reduced) return; fx.flash = { color: color || '#ffffff', t: frames | 0, n: frames | 0, a: alpha == null ? 0.3 : alpha }; },
    setScene: s => setScene(s)
  };
  const reduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const fx = { shake: 0, shakeT: 0, flash: null, pops: [], sparks: [], banner: null };
  function each(hook, ...args) { for (const a of GAME.addons) { if (a && typeof a[hook] === 'function') { try { a[hook](...args); } catch (e) { console.error('addon ' + (a.name || '?') + '.' + hook + ': ' + e.message); } } } }
  function setScene(s) { GAME.scene = s; sceneT = 0; each('onPhase', s, GAME); }
  let sceneT = 0;

  // =================================================================== 3. Map scene: the GameDNA_LevelMap instance
  function makeMap(state) {
    GAME.map = GameDNA_LevelMap.create({
      nodes: MAP_NODES, edges: MAP_EDGES, state, view: { x: 0, y: 0, w: W, h: H },
      params: { walk: 1.25, reveal: 4, spacing: 6, terrain: 'coast', locked: 'faint', panel: 'auto', iris: 'on' },
      enterLevel: id => startLevel(id),
      onSave: st => { GAME.run.saves++; saveGame(st); },
      onShop: () => { shop = { sel: 0, t: 0, msg: '' }; },
      onSound: name => sfx(name),
      onEvent: ev => each('onMapEvent', ev, GAME),
      enabled: () => GAME.scene === 'map' && !shop,
      auto: () => GAME.autoplay.on,
      avoid: () => shop ? [SHOP_RECT] : [],
      nodeInfo: id => {
        const L = LEVELS[id]; if (!L) return null;
        if (L.boss) return { lines: ['THE WARDEN WAITS'] };
        const total = coinTotal(id), items = [{ icon: 'coin', have: GAME.run.best[id] || 0, total }];
        if (L.chunks.includes('key')) items.push({ icon: 'key', have: GAME.run.keys[id] ? 1 : 0, total: 1 });
        return { items };
      }
    });
  }
  const coinTotals = {};
  function coinTotal(id) { if (coinTotals[id] == null) coinTotals[id] = buildTiles(LEVELS[id]).coins.length; return coinTotals[id]; }
  function saveGame(st) { if (TEST) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify({ map: st, run: { lives: GAME.run.lives, coins: GAME.run.coins, best: GAME.run.best, keys: GAME.run.keys } })); } catch (e) { } }
  function loadGame() { if (TEST) return null; try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } }
  // the shop window (host UI): Z buys a heart (+1 life) for 10 coins, X leaves
  let shop = null;
  const SHOP_RECT = { x: 48, y: 64, w: 160, h: 60 };
  function shopKey(k) {
    if (k === 'ok') { if (GAME.run.coins >= SHOP.price) { GAME.run.coins -= SHOP.price; GAME.run.lives++; shop.msg = 'THANK YOU'; sfx('save'); } else { shop.msg = 'NOT ENOUGH COINS'; sfx('deny'); } shop.t = 0; }
    else if (k === 'back') shop = null;
  }

  // =================================================================== 4. Level scene
  function buildTiles(L) {
    const cols = [], ents = [], coins = [];
    for (const name of L.chunks) {
      const c = CH[name], x0 = cols.length;
      for (let x = 0; x < c[0].length; x++) {
        const col = [];
        for (let r = 0; r < ROWS; r++) {
          const ch = c[r][x];
          if (ch === '#' || ch === '=') col.push(ch); else col.push('.');
          if (ch === 'o') coins.push({ x: (x0 + x) * TS + 4, y: r * TS + 4, w: 8, h: 8 });
          else if ('kchgGB'.includes(ch) && ch !== '.') ents.push({ ch, c: x0 + x, r });
        }
        cols.push(col);
      }
    }
    return { cols, ents, coins };
  }
  let nextId = 1;
  function startLevel(id) {
    const L = LEVELS[id]; if (!L) { GAME.map.fail(id); return; }
    const T = buildTiles(L);
    const lv = GAME.L = { id, def: L, cols: T.cols, w: T.cols.length * TS, coins: T.coins.map(c => Object.assign({ taken: false }, c)), got: 0,
      enemies: [], items: [], goal: null, hero: newHero(), camX: 0, t: 0, end: null, endT: 0, hasKey: false, boss: null };
    for (const e of T.ents) {
      const x = e.c * TS, y = e.r * TS;
      if (e.ch === 'c') lv.enemies.push({ id: 'crab-' + nextId++, type: 'crab', x: x + 1, y: y + 7, w: 14, h: 9, vx: rand() < 0.5 ? -0.5 : 0.5, vy: 0, hp: 2, max: 2, kb: 0, hitCd: 0, t: (rand() * 60) | 0 });
      else if (e.ch === 'g') lv.enemies.push({ id: 'gull-' + nextId++, type: 'gull', hx: x, hy: y, x, y, w: 13, h: 8, hp: 1, max: 1, kb: 0, hitCd: 0, t: (rand() * 400) | 0 });
      else if (e.ch === 'B') { const b = { id: 'warden', type: 'boss', x: x - 4, y: y - 10, w: 24, h: 26, vx: 0, vy: 0, hp: 8, max: 8, kb: 0, hitCd: 0, t: 0, stagger: 0, jumpT: 150, onGround: false }; lv.enemies.push(b); lv.boss = b; }
      else if (e.ch === 'k') { if (!GAME.run.keys[id]) lv.items.push({ type: 'key', x: x + 4, y: y + 3, w: 8, h: 9 }); }
      else if (e.ch === 'h') lv.items.push({ type: 'heart', x: x + 4, y: y + 5, w: 8, h: 7 });
      else if (e.ch === 'G') lv.goal = { x: x + 6, y: y - 48, w: 6, h: 64 };
    }
    GAME.run.levelsPlayed++;
    autoMem.lastX = 0; autoMem.stuck = 0; autoMem.hold = 0;
    setScene('level'); fx.banner = { text: L.name.toUpperCase(), t: 0, kind: 'start' };
    each('onLevelStart', id, GAME);
  }
  function newHero() { return { id: 'hero', x: 2 * TS, y: 10 * TS - 18, w: 11, h: 18, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jumpBuf: 0, swingT: 0, swingHit: {}, inv: 0, hp: 3, max: 3, animT: 0, cut: false, dead: false }; }
  function solidAt(px, py) {
    const lv = GAME.L, c = Math.floor(px / TS), r = Math.floor(py / TS);
    if (c < 0 || c >= lv.cols.length) return true;
    if (r < 0 || r >= ROWS) return false;
    const ch = lv.cols[c][r]; return ch === '#' || ch === '=';
  }
  function moveX(e, dx) {
    e.x += dx; const probes = [e.y, e.y + e.h / 2, e.y + e.h - 0.01];
    if (dx > 0) { const edge = e.x + e.w - 0.01; if (probes.some(py => solidAt(edge, py))) { e.x = Math.floor(edge / TS) * TS - e.w; return true; } }
    else if (dx < 0) { if (probes.some(py => solidAt(e.x, py))) { e.x = (Math.floor(e.x / TS) + 1) * TS; return true; } }
    return false;
  }
  function moveY(e, dy) {
    e.y += dy; const probes = [e.x + 0.5, e.x + e.w - 0.5];
    if (dy > 0) { const edge = e.y + e.h - 0.01; if (probes.some(px => solidAt(px, edge))) { e.y = Math.floor(edge / TS) * TS - e.h; return 'floor'; } }
    else if (dy < 0) { if (probes.some(px => solidAt(px, e.y))) { e.y = (Math.floor(e.y / TS) + 1) * TS; return 'ceil'; } }
    return null;
  }
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  function swordBox(h) { if (h.swingT < 4 || h.swingT > 12) return null; return { x: h.face > 0 ? h.x + h.w : h.x - 19, y: h.y + 1, w: 19, h: 15 }; }
  function updateHero(inp) {
    const h = GAME.L.hero, dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (dir && h.swingT === 0) h.face = dir;
    h.vx += (dir * 1.6 - h.vx) * (h.onGround ? 0.25 : 0.12);
    h.coyote = h.onGround ? 6 : Math.max(0, h.coyote - 1);
    h.jumpBuf = inp.jump ? 6 : Math.max(0, h.jumpBuf - 1);
    if (h.jumpBuf > 0 && h.coyote > 0) { h.vy = -4.6; h.coyote = 0; h.jumpBuf = 0; h.cut = false; sfx('jump'); dust(h.x + h.w / 2, h.y + h.h); }
    if (!inp.jumpHeld && h.vy < -2 && !h.cut) { h.vy = -2; h.cut = true; }
    h.vy = Math.min(h.vy + 0.25, 5);
    if (moveX(h, h.vx)) h.vx = 0;
    const was = h.onGround, hit = moveY(h, h.vy);
    h.onGround = hit === 'floor'; if (hit) h.vy = 0;
    if (h.onGround && !was) dust(h.x + h.w / 2, h.y + h.h);
    if (inp.act && h.swingT === 0) { h.swingT = 16; h.swingHit = {}; sfx('swing'); }
    if (h.swingT > 0) h.swingT--;
    if (h.inv > 0) h.inv--;
    h.animT += Math.abs(h.vx);
    if (h.x < 0) h.x = 0;
    if (h.y > ROWS * TS + 24) applyHit({ source: 'fall', target: 'hero', kind: 'damage', amount: h.hp, cause: 'fall' });
  }
  function updateEnemies() {
    const lv = GAME.L, h = lv.hero, sb = swordBox(h);
    for (const e of lv.enemies) {
      e.t++; if (e.hitCd > 0) e.hitCd--;
      if (e.type === 'crab') {
        const blocked = moveX(e, e.vx + e.kb); e.kb *= 0.82; if (Math.abs(e.kb) < 0.05) e.kb = 0;
        const ahead = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
        if (blocked || !solidAt(ahead, e.y + e.h + 2)) e.vx = -e.vx;
        e.vy = Math.min(e.vy + 0.25, 5); if (moveY(e, e.vy)) e.vy = 0;
        if (e.y > ROWS * TS + 24) e.dead = true;
      } else if (e.type === 'gull') {
        e.kb *= 0.9; e.x = e.hx + Math.sin(e.t * 0.02) * 28 + e.kb; e.y = e.hy + Math.sin(e.t * 0.07) * 10;
      } else if (e.type === 'boss') updateBoss(e, h);
      if (sb && !h.swingHit[e.id] && e.hitCd === 0 && overlap(sb, e)) {
        h.swingHit[e.id] = 1; e.hitCd = 12;
        const crit = rand() < 0.1;
        applyHit({ source: 'hero', target: e.id, kind: 'damage', amount: crit ? 2 : 1, crit });
        e.kb = h.face * (e.type === 'boss' ? 2.6 : 2.2);
      }
      if (!e.dead && e.hp > 0 && overlap(h, e) && h.inv === 0 && !h.dead) applyHit({ source: e.id, target: 'hero', kind: 'damage', amount: 1, x: e.x + e.w / 2 });
    }
    lv.enemies = lv.enemies.filter(e => !e.dead);
  }
  function updateBoss(b, h) {
    if (b.stagger > 0) { b.stagger--; moveX(b, b.kb); b.kb *= 0.86; }
    else if (b.onGround) {
      const dir = Math.sign(h.x - b.x) || 1; b.vx = dir * 0.55; moveX(b, b.vx);
      if (--b.jumpT <= 0) { b.vy = -4.2; b.jumpT = 170 + ((rand() * 60) | 0); sfx('jump'); }
    } else moveX(b, b.vx * 1.6);
    b.vy = Math.min(b.vy + 0.22, 5); const was = b.onGround, r = moveY(b, b.vy); b.onGround = r === 'floor'; if (r) b.vy = 0;
    if (b.onGround && !was) { GAME.shake(2, 10); dust(b.x + 4, b.y + b.h); dust(b.x + b.w - 4, b.y + b.h); }
  }
  function updateLevel(inp) {
    const lv = GAME.L; lv.t++; GAME.clock.levelFrame++;
    if (lv.end) { lv.endT++; if (lv.end === 'win') lv.hero.vx = 0.8; endStep(); return; }
    updateHero(inp); if (lv.end) return;
    updateEnemies(); if (lv.end) return;
    const h = lv.hero;
    for (const c of lv.coins) if (!c.taken && overlap(h, c)) { c.taken = true; lv.got++; GAME.run.coins++; sfx('coin'); spark(c.x + 4, c.y + 4, '#ffe070'); }
    for (const it of lv.items) if (!it.taken && overlap(h, it)) {
      it.taken = true;
      if (it.type === 'key') { lv.hasKey = true; sfx('open'); fx.banner = { text: 'KEY FOUND', t: 0, kind: 'key' }; }
      else applyHit({ source: 'heart', target: 'hero', kind: 'heal', amount: 1 });
    }
    if (lv.boss && lv.boss.hp <= 0 && !lv.goal) lv.goal = { x: (lv.cols.length - 6) * TS + 6, y: 10 * TS - 64, w: 6, h: 64 };   // the flag appears when the warden falls
    if (lv.goal && overlap(h, lv.goal) && !lv.end) { lv.end = 'win'; lv.endT = 0; sfx('open'); fx.banner = { text: lv.def.boss ? 'THE KEEP IS QUIET' : 'COURSE CLEAR', t: 0, kind: 'clear' }; }
    lv.camX = Math.round(Math.max(0, Math.min(lv.cols.length * TS - W, h.x + h.w / 2 - 110)));
  }
  function endStep() {
    const lv = GAME.L;
    if (lv.end === 'win') { moveX(lv.hero, lv.hero.vx); lv.hero.animT += 0.8; }
    if (lv.endT < (lv.end === 'win' ? 110 : 70)) return;
    const id = lv.id, result = lv.end;
    GAME.run.best[id] = Math.max(GAME.run.best[id] || 0, lv.got);
