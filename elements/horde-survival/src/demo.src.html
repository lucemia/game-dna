<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde Survival Demo</title>
<style>
  :root { --bg: #0d0f14; --panel: #171a24; --line: #2c3142; --ink: #e8e4d8; --dim: #9aa0b4; --gold: #d6be82; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 14px 16px 28px; }
  h1 { font: 700 20px Georgia, serif; margin: 0 0 2px; color: #fff1c2; }
  p.lede { margin: 0 0 10px; color: var(--dim); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #10140e; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button { background: #262b3b; color: var(--ink); border: 1px solid #3d4460; border-radius: 7px; padding: 7px 11px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:hover { border-color: var(--gold); } button.on { background: #4a3d1e; border-color: var(--gold); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; color: var(--dim); font-size: 12.5px; }
  label input, label select { grid-column: 1 / 3; width: 100%; accent-color: var(--gold); }
  select { background: #262b3b; color: var(--ink); border: 1px solid #3d4460; border-radius: 6px; padding: 4px 6px; font: 13px system-ui, sans-serif; }
  label b { color: var(--ink); font-weight: 600; }
  @media (max-width: 600px) { .stage { aspect-ratio: 9 / 16; max-height: 82vh; } }
  #stats { margin-top: 8px; color: var(--dim); font: 12px ui-monospace, Menlo, monospace; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Horde survival auto-attacker</h1>
  <p class="lede">Walk with arrows / WASD or drag on the field. Weapons fire on their own; gems pull in; each level offers 1 of 3 upgrades.</p>
  <div class="stage"><canvas id="game" width="1280" height="720"></canvas></div>
  <div class="bar" id="buttons"></div>
  <div class="grid" id="controls"></div>
  <div id="stats"></div>
</main>
<script src="../../../demo-kit/kit-art.js"></script>
<script src="../../../demo-kit/kit.js"></script>
<script src="../starter/art/vigil-art.js"></script>
<script>
/*@@MODULE@@*/
</script>
<script>
/*@@DEMO@@*/
</script>
</body>
</html>
