<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toon outlines and cel shading</title>
<style>
  :root { --ink: #f4ecdc; --dim: #b8ae9c; --panel: rgba(20, 18, 30, 0.8); --edge: rgba(255, 222, 168, 0.24); --accent: #ffcf70; }
  html, body { margin: 0; height: 100%; background: #14121c; overflow: hidden; color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #gl, #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { touch-action: none; cursor: grab; }
  #ui.split-hover { cursor: ew-resize; }
  .card { position: absolute; left: 16px; top: 14px; padding: 9px 14px 10px; background: linear-gradient(180deg, rgba(36, 28, 46, 0.86), rgba(20, 16, 28, 0.86)); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); pointer-events: none; max-width: calc(100% - 300px); }
  .card h1 { margin: 0; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .card p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  #panel { position: absolute; right: 14px; top: 14px; width: 244px; padding: 10px 12px 12px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); box-sizing: border-box; }
  #panel:not([open]) { width: auto; }
  #panel summary { cursor: pointer; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; font-size: 12px; list-style: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: ' \25BE'; color: var(--dim); }
  #panel label { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin-top: 8px; color: var(--dim); font-size: 12px; }
  #panel select, #panel input[type=range] { width: 100%; min-width: 0; }
  #panel select { background: #2a2436; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 2px 4px; font: inherit; }
  #panel input[type=range] { accent-color: var(--accent); }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1; background: #3a2c24; color: var(--ink); border: 1px solid var(--edge); border-radius: 7px; padding: 5px 0; font: inherit; cursor: pointer; }
  .row button:hover { background: #4a382a; }
  .hint { transition: opacity 0.6s; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); color: rgba(244, 236, 220, 0.76); font-size: 12px; background: rgba(18, 14, 26, 0.58); padding: 4px 12px; border-radius: 99px; pointer-events: none; white-space: nowrap; }
  #nogl { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--ink); font-size: 15px; background: #14121c; }
  @media (max-width: 560px) {
    #panel { left: 16px; right: 16px; top: auto; bottom: 14px; width: auto; }
    #panel:not([open]) { left: auto; right: 12px; top: 10px; bottom: auto; }
    .card { left: 12px; top: 10px; padding: 7px 11px 8px; max-width: calc(100% - 150px); }
    .card h1 { font-size: 13px; }
    .card p { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <div class="card"><h1>Toon outlines &amp; cel shading</h1><p>One call turns an existing three.js scene cel-shaded</p></div>
  <details id="panel">
    <summary>Settings</summary>
    <label>Scene <select id="p-scene"><option value="island">Island courtyard</option><option value="terrace">Terrace skirmish</option></select></label>
    <label>Preset <select id="p-preset"><option value="soft3">Soft 3-band</option><option value="crisp2">Crisp 2-band</option><option value="painted4">Painted 4-band</option><option value="ink">Ink outline only</option></select></label>
    <label>View <select id="p-view"><option value="split">Before / after</option><option value="toon">Toon only</option><option value="orig">Original only</option></select></label>
    <label>Line width <input id="p-width" type="range" min="0" max="5" step="0.1"></label>
    <label>Line colour <select id="p-color"><option value="tint">Tinted</option><option value="ink">Ink</option></select></label>
    <label>Rim light <input id="p-rim" type="range" min="0" max="1" step="0.02"></label>
    <div class="row"><button id="b-replay">Replay</button><button id="b-pause">Pause</button></div>
  </details>
  <div class="hint">Drag the divider to compare &middot; drag elsewhere to turn the camera</div>
  <div id="nogl">This demo needs WebGL, which is not available in this browser.</div>
</div>
<script src="three.min.js"></script>
<script src="../../third-person-3d/module/third-person-3d.js"></script>
<script src="../../tactics-grid-3d/module/tactics-grid-3d.js"></script>
<script src="../module/toon-outlines-3d.js"></script>
<script>
/* N-04 demo. Two scenes built by other elements' modules (N-01 island, N-03 terrace), turned toon by
   GameDNA_Toon3D in one call. The before / after split renders the same frame twice with a scissor:
   left = the scene's own materials (toon.setEnabled(false)), right = toon (setEnabled(true)).
   ?t=<ms>&freeze=1 fast-forwards the fixed 60 Hz simulation and draws one frame (window.__frozen = true).
   URL: ?scene=island|terrace &preset=soft3|crisp2|painted4|ink &view=split|toon|orig &split=0..1 &width= &color=tint|ink &rim=
   &yaw=<deg> (island camera turn) &dpr=1..3 &apply=0 (build the instance but leave the scene untouched: used by checks/restore.py)
   &glcheck=1 (three.js shader error checks on) */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search), DT = 1 / 60;
  function qn(k, d) { var v = Q.get(k); return v == null || v === '' || isNaN(+v) ? d : +v; }
  var FREEZE = Q.get('freeze') === '1', T_GOAL = qn('t', -1);
  var PAR = { scene: Q.get('scene') === 'terrace' ? 'terrace' : 'island', preset: Q.get('preset') || 'soft3', view: Q.get('view') || 'split', split: qn('split', 0.5),
    width: Q.has('width') ? qn('width', 2.2) : null, color: Q.get('color') || null, rim: Q.has('rim') ? qn('rim', 0.3) : null, yaw: qn('yaw', 0), dpr: qn('dpr', 2) };
  if (!window.GameDNA_Toon3D.PRESETS[PAR.preset]) PAR.preset = 'soft3';
  var Toon = window.GameDNA_Toon3D, glc = document.getElementById('gl'), ui = document.getElementById('ui'), g = ui.getContext('2d');
  window.__frozen = false;
  if (!window.THREE || !Toon.webglOK()) {
    document.getElementById('nogl').style.display = 'flex';
    window.__state = function () { return { t: 0, actors: [], webgl: false }; }; window.__frozen = true; return;
  }
  var THREE = window.THREE;
  var D = window.DEMO = { time: 0, frame: 0, paused: false };
  var W = innerWidth, H = innerHeight;

  // ------------------------------------------------------------------ scene A: island courtyard (N-01 module)
  function buildIsland() {
    var TP3 = window.GameDNA_ThirdPerson3D;
    var TP = TP3.create({ THREE: THREE, canvas: glc, overlay: null, params: { palette: 'meadow', camDist: 7.4, camPitch: 24, autoAlign: 0, maxDpr: PAR.dpr, shadows: 'soft' }, seed: 5 });
    if (!TP.ok) return null;
    TP.buildIsland({ radius: 15, seed: 3 });
    TP.paint.path([[0, 14], [0, 5]], 1.5); TP.paint.path([[-5, -1], [-12, -4]], 1.3); TP.paint.path([[4.6, -2], [11, -6]], 1.3); TP.paint.plaza(0, 0, 0.6, 5.2);
    TP.paint.flowers(7, 7, 3, ['#f6f0e0', '#f2c84a', '#e86a8a'], 160); TP.paint.flowers(-8, 7, 3, ['#b48ae6', '#f6f0e0'], 140); TP.paint.done();
    TP.buildLayout([
      { kind: 'arch', x: 0, z: 7.2 }, { kind: 'wall', x: -4.2, z: 7.2, len: 4.4 }, { kind: 'wall', x: 4.2, z: 7.2, len: 4.4 },
      { kind: 'pillar', x: 5.6, z: 2.4 }, { kind: 'pillar', x: -5.6, z: 2.4, broken: true, v: 1 }, { kind: 'pillar', x: 4.4, z: -4.6, broken: true, v: 2 }, { kind: 'pillar', x: -4.4, z: -4.6 },
      { kind: 'fountain', x: 0, z: -8.4 }, { kind: 'lantern', x: 2.0, z: 5.6, rot: Math.PI }, { kind: 'lantern', x: -6.8, z: -1.6 },
      { kind: 'stall', x: -8.8, z: 4.6, rot: 0.7, cloth: '#c8463c' }, { kind: 'barrel', x: -10.4, z: 2.4 }, { kind: 'crate', x: -7.0, z: 6.6, rot: 0.4 },
      { kind: 'tree', x: 8.6, z: -2.4, s: 1.1 }, { kind: 'tree', x: 10.4, z: 3.4, s: 1.0, pine: true }, { kind: 'tree', x: -10.6, z: -6.0, s: 1.15 }, { kind: 'tree', x: 6.6, z: 10.4, s: 1.0 },
      { kind: 'tree', x: -7.2, z: 10.6, s: 1.1, pine: true }, { kind: 'tree', x: 4.2, z: -11.6, s: 1.0, pine: true }, { kind: 'tree', x: -4.4, z: -11.8, s: 1.05 },
      { kind: 'rock', x: 9.4, z: -8.4, s: 1.1 }, { kind: 'rock', x: -11.6, z: 1.0, s: 0.9 }, { kind: 'rock', x: 11.8, z: 6.8, s: 0.8 },
      { kind: 'bush', x: 2.8, z: 9.0 }, { kind: 'bush', x: -2.9, z: 9.2, berries: true }, { kind: 'bush', x: 7.4, z: -6.2, berries: true }, { kind: 'bush', x: -8.0, z: -2.6 }
    ]);
    TP.scatter({ count: 520, flowers: 100, seed: 4, avoid: function (x, z) { return Math.hypot(x, z) < 5.6 || (Math.abs(x) < 1.2 && z > 5); } });
    var hero = TP.addActor({ id: 'hero', kind: 'hero', x: 0, z: 11.5, yaw: Math.PI });
    TP.setHero('hero'); TP.snapCamera(PAR.yaw * Math.PI / 180);
    var keeper = TP.addActor({ id: 'keeper', kind: 'npc', x: -0.3, z: -4.0, yaw: 0.6, look: { base: 'keeper' }, height: 1.75 });
    var villager = TP.addActor({ id: 'villager', kind: 'npc', x: 3.0, z: -2.6, yaw: -0.6, look: { base: 'villager' }, height: 1.6 });
    TP.addPickup({ id: 'shard-a', x: 9.0, z: 0.6 }); TP.addPickup({ id: 'shard-b', x: -9.4, z: -3.0 });
    // the hero walks a loop through the courtyard; the two villagers turn to face it when it comes close
    var TOUR = [[0, 6.2, 0], [0, 1.8, 0], [3.4, -1.2, 0], [6.6, -2.8, 1], [9.0, 0.6, 1], [5.2, 4.0, 0], [-1.0, 1.0, 0], [-6.4, -0.4, 1], [-9.4, -3.0, 0], [-5.6, 4.2, 1], [-1.4, 9.8, 1], [0, 11.5, 0]], ti = 0;
    var S = { kind: 'island', TP: TP, scene: TP.scene, camera: TP.camera, renderer: TP.renderer, cast: [keeper, villager] };
    S.step = function () {
      var w = TOUR[ti], r = TP.autopilot({ x: w[0], z: w[1] }, { near: 0.6, run: !!w[2] });
      if (r.arrived) ti = (ti + 1) % TOUR.length;
      S.cast.forEach(function (a) { var d = Math.hypot(a.x - hero.x, a.z - hero.z); a.target = d < 6 ? 'hero' : null; a.play(d < 3.0 ? 'wave' : null); });
      TP.step({ x: r.x, y: r.y, run: r.run, camYaw: S.camYaw || 0 }, DT); S.camYaw = 0;
    };
    S.render = function () { TP.render(); };
    S.resize = function (w, h) { TP.resize(w, h); };
    S.rotate = function (dx, dy) { TP.rotateCamera(-dx * 0.006, dy * 0.004); };
    S.state = function () {
      var st = TP.state();
      return st.actors.map(function (a) { var o = actor2d(a, TP.project(a.x, 1.0, a.z), TP.project(a.x + a.forward[0] * 0.6, 1.0, a.z + a.forward[1] * 0.6)); return o; });
    };
    return S;
  }

  // ------------------------------------------------------------------ scene B: terrace skirmish (N-03 module)
  function buildTerrace() {
    var TG = window.GameDNA_TacticsGrid3D;
    var MAP = {
      heights: ['3332210000', '3332211000', '3322211000', '2222111000', '2211110000', '1111100000', '1111100000', '1110000000'],
      terrain: ['ggggsggggw', 'gggssgggww', 'ggsgggggww', 'gssgggdwww', 'ssggggdwww', 'sgggggddww', 'gggggddwww', 'gggdddwwww'],
      props: ['P...r.T...', '.T........', '..........', '..........', 'R.........', '.....T....', '..........', 'T..r......']
    };
    var units = [
      { id: 'aldric', side: 'a', cls: 'knight', x: 2, z: 2, mv: 4, jump: 2, rng: [1, 1] },
      { id: 'brenna', side: 'a', cls: 'lancer', x: 1, z: 4, mv: 4, jump: 2, rng: [1, 1] },
      { id: 'gorrak', side: 'b', cls: 'brute', x: 6, z: 3, mv: 4, jump: 2, rng: [1, 1] },
      { id: 'vesh', side: 'b', cls: 'shaman', x: 6, z: 5, mv: 3, jump: 2, rng: [1, 2] }
    ];
    var tg = TG.create({ THREE: THREE, canvas: glc, overlay: null, map: MAP, units: function () { return units; }, seed: 4,
      params: { zoom: innerWidth < innerHeight ? qn('pz', 0.88) : 2.0, frameScale: 1, camStep: 0, light: 'day', shadows: 'soft', quality: 'high' } });
    units.forEach(function (u) { tg.addActor({ id: u.id, side: u.side, cls: u.cls, x: u.x, z: u.z, face: u.side === 'a' ? [1, 0] : [-1, 0] }); });
    var portrait = innerWidth < innerHeight; tg.focus(qn('fx', portrait ? 3.0 : 3.9), qn('fz', 4.4), true);   // centre of the four units, nudged so they sit above the bottom UI
    var S = { kind: 'terrace', tg: tg, scene: tg.scene, camera: tg.camera, renderer: tg.renderer, f: 0 };
    var HOME = units.map(function (u) { return [u.x, u.z]; });
    // a 10 s loop: Aldric walks up to Gorrak and strikes, Vesh answers with a bolt, Brenna steps forward, everyone walks back
    var plan = [
      { at: 60, run: function () { walkTo('aldric', 5, 3); } },
      { at: 190, run: function () { tg.attack('aldric', 'gorrak', { onImpact: function () { tg.hurt('gorrak', 'aldric'); } }); } },
      { at: 290, run: function () { tg.attack('vesh', 'aldric', { kind: 'bolt', onImpact: function () { tg.hurt('aldric', 'vesh'); } }); } },
      { at: 330, run: function () { walkTo('brenna', 3, 4); } },
      { at: 470, run: function () { walkTo('aldric', HOME[0][0], HOME[0][1]); } },
      { at: 520, run: function () { walkTo('brenna', HOME[1][0], HOME[1][1]); } },
      { at: 640, run: function () { units.forEach(function (u, i) { u.x = HOME[i][0]; u.z = HOME[i][1]; tg.setTile(u.id, u.x, u.z); tg.face(u.id, u.side === 'a' ? [1, 0] : [-1, 0]); }); } }
    ];
    function walkTo(id, x, z) {
      var u = units.filter(function (q) { return q.id === id; })[0], reach = tg.reachOf(u, units), path = tg.pathTo(reach, x, z);
      if (path && path.length > 1) { tg.walk(id, path); u.x = x; u.z = z; }
    }
    S.step = function () {
      var k = S.f % 660; plan.forEach(function (p) { if (p.at === k) p.run(); }); S.f++;
      tg.update(DT * 1000);
    };
    S.render = function () { tg.render(); };
    S.resize = function (w, h) { tg.setView(w, h); tg.resize(w, h, Math.min(PAR.dpr, window.devicePixelRatio || 1)); };
    S.rotate = function (dx) { if (Math.abs(dx) > 60) { tg.rotate(dx > 0 ? 1 : -1); return true; } return false; };
    S.state = function () {
      return tg.state().actors.map(function (a) {
        var f = a.forward || [0, 0], y = (a.tileTop || 0) + 0.6, c = tg.project(a.x, y, a.z), e = tg.project(a.x + f[0] * 0.5, y, a.z + f[1] * 0.5);
        a.moving = !!a.moveDir && a.anim === 'walk';
        return actor2d(a, c, e);
      });
    };
    return S;
  }

  // a 3D actor as text state: world fields from the scene module, plus its screen x and the side it looks at on screen
  function actor2d(a, c, e) {
    var o = { id: a.id, x: c ? +c.x.toFixed(1) : 0, wx: a.x, wz: a.z, yaw: a.yaw, moveDir: a.moveDir, forward: a.forward, target: a.target || null, facesMove: a.facesMove, moving: !!a.moving, feetY: a.feetY };
    var dx = c && e ? e.x - c.x : 0;
    if (Math.abs(dx) < 4) { o.noFace = true; o.facing = dx >= 0 ? 'right' : 'left'; } else o.facing = dx > 0 ? 'right' : 'left';
    o.vx = a.moving && a.moveDir && c && e ? Math.sign(dx) : 0;
    return o;
  }

  var S = PAR.scene === 'terrace' ? buildTerrace() : buildIsland();
  if (!S) { document.getElementById('nogl').style.display = 'flex'; window.__state = function () { return { t: 0, actors: [], webgl: false }; }; window.__frozen = true; return; }
  var R = S.renderer;
  if (Q.get('glcheck') === '1') R.debug.checkShaderErrors = true;

  // ------------------------------------------------------------------ the element: one call
  var opts = { scene: S.scene, camera: S.camera, renderer: R, preset: PAR.preset, apply: Q.get('apply') !== '0' };
  if (PAR.width != null) opts.width = PAR.width;
  if (PAR.color) opts.color = PAR.color;
  if (PAR.rim != null) opts.rim = PAR.rim;
  // no fade callback: the island camera's screen-door fade keeps its value in material.userData.fadeU, which the module reads itself
  var toon = D.toon = Toon.create(opts);
  // for checks: the scene adapter and a unit's screen box (CSS px)
  D.S = S;
  D.box = function (id) {
    if (S.kind === 'island') { var a = S.TP.anchor(id); if (!a || !a.visible) return null; var w = a.h * 0.42; return { x0: a.footX - w, y0: a.y, x1: a.footX + w, y1: a.footY }; }
    var b = S.tg.anchorOf(id); return b ? { x0: b.left, y0: b.top, x1: b.left + b.w, y1: b.top + b.h } : null;
  };

  // ------------------------------------------------------------------ size, split, input
  var splitX = PAR.split, dragging = null;
  function resize() {
    W = innerWidth; H = innerHeight;
    var dpr = Math.min(PAR.dpr, window.devicePixelRatio || 1);
    S.resize(W, H);
    ui.width = Math.round(W * dpr); ui.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', function () { resize(); draw(); });
  function nearSplit(x) { return PAR.view === 'split' && Math.abs(x - splitX * W) < 22; }
  ui.addEventListener('pointerdown', function (e) { dragging = { split: nearSplit(e.clientX), x: e.clientX, y: e.clientY, acc: 0 }; ui.setPointerCapture(e.pointerId); });
  ui.addEventListener('pointermove', function (e) {
    ui.classList.toggle('split-hover', nearSplit(e.clientX));
    if (!dragging) return;
    if (dragging.split) { splitX = Math.max(0.04, Math.min(0.96, e.clientX / W)); if (FREEZE || D.paused) draw(); return; }
    var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
    if (S.kind === 'island') { S.rotate(dx, dy); dragging.x = e.clientX; dragging.y = e.clientY; }
    else if (S.rotate(dx)) { dragging.x = e.clientX; }
    if (FREEZE || D.paused) draw();
  });
  ui.addEventListener('pointerup', function () { dragging = null; });

  // ------------------------------------------------------------------ panel
  function $(id) { return document.getElementById(id); }
  $('p-scene').value = PAR.scene; $('p-preset').value = PAR.preset; $('p-view').value = PAR.view;
  $('p-width').value = toon.params.width; $('p-color').value = toon.params.color; $('p-rim').value = toon.params.rim;
  function reload(k, v) { var q = new URLSearchParams(location.search); q.set(k, v); q.delete('t'); q.delete('freeze'); location.search = q.toString(); }
  $('p-scene').onchange = function () { reload('scene', this.value); };
  $('p-preset').onchange = function () { toon.set({ preset: this.value }); $('p-width').value = toon.params.width; $('p-color').value = toon.params.color; $('p-rim').value = toon.params.rim; PAR.preset = this.value; draw(); };
  $('p-view').onchange = function () { PAR.view = this.value; draw(); };
  $('p-width').oninput = function () { toon.set({ width: +this.value }); draw(); };
  $('p-color').onchange = function () { toon.set({ color: this.value }); draw(); };
  $('p-rim').oninput = function () { toon.set({ rim: +this.value }); draw(); };
  $('b-replay').onclick = function () { location.reload(); };
  $('b-pause').onclick = function () { D.paused = !D.paused; this.textContent = D.paused ? 'Play' : 'Pause'; };
  $('panel').open = false;   // collapsed by default; one click opens it
  var hint = document.querySelector('.hint');
  function hideHint() { hint.style.opacity = '0'; }
  if (FREEZE) hint.style.display = 'none'; else { setTimeout(hideHint, 6000); ui.addEventListener('pointerdown', hideHint); }

  // ------------------------------------------------------------------ step and draw
  function step() { D.time += DT; D.frame++; S.step(); }
  function renderSplit() {
    toon.update(DT * 1000);
    if (PAR.view === 'toon') { toon.setEnabled(true); S.render(); return; }
    if (PAR.view === 'orig') { toon.setEnabled(false); S.render(); toon.setEnabled(true); return; }
    var sx = Math.round(splitX * W);
    R.setScissorTest(true);
    toon.setEnabled(false); R.setScissor(0, 0, sx, H); S.render();
    toon.setEnabled(true); R.setScissor(sx, 0, W - sx, H); S.render();
    R.setScissorTest(false);
  }
  function label(text, x, y, align) {
    g.font = '700 12px system-ui, -apple-system, "Segoe UI", sans-serif'; var w = g.measureText(text).width + 18;
    var bx = align === 'right' ? x - w : x;
    g.fillStyle = 'rgba(20, 16, 28, 0.78)'; g.strokeStyle = 'rgba(255, 222, 168, 0.35)'; g.lineWidth = 1;
    g.beginPath(); g.roundRect ? g.roundRect(bx, y, w, 22, 11) : g.rect(bx, y, w, 22); g.fill(); g.stroke();
    g.fillStyle = '#ffcf70'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillText(text, bx + 9, y + 11.5);
  }
  function drawUI() {
    g.clearRect(0, 0, W, H);
    var narrow = W <= 560, y = narrow ? 50 : 74;
    if (PAR.view === 'split') {
      var sx = Math.round(splitX * W);
      g.fillStyle = 'rgba(16, 12, 22, 0.55)'; g.fillRect(sx - 2, 0, 4, H);
      g.fillStyle = '#ffe2a8'; g.fillRect(sx - 1, 0, 2, H);
      var hy = Math.round(H * 0.84);   // low, off the characters' bodies
      g.fillStyle = '#ffe2a8'; g.strokeStyle = 'rgba(30, 22, 36, 0.9)'; g.lineWidth = 2;
      g.beginPath(); g.arc(sx, hy, 15, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = '#2a1e30'; g.beginPath(); g.moveTo(sx - 4, hy - 6); g.lineTo(sx - 10, hy); g.lineTo(sx - 4, hy + 6); g.fill();
      g.beginPath(); g.moveTo(sx + 4, hy - 6); g.lineTo(sx + 10, hy); g.lineTo(sx + 4, hy + 6); g.fill();
      if (sx > 120) label('ORIGINAL', 14, y, 'left');
      if (W - sx > 120) label('TOON  ' + presetName(), W - 14, y, 'right');
    } else label(PAR.view === 'toon' ? 'TOON  ' + presetName() : 'ORIGINAL', W - 14, y, 'right');
  }
  function presetName() { return { soft3: 'soft 3-band', crisp2: 'crisp 2-band', painted4: 'painted 4-band', ink: 'ink only' }[toon.params.preset] || toon.params.preset; }
  function draw() { renderSplit(); drawUI(); }

  window.__state = function () {
    return { t: Math.round(D.time * 1000), scene: S.kind, view: PAR.view, split: +splitX.toFixed(3), toon: toon.state(), actors: S.state() };
  };
  window.__advance = function (ms) { var n = Math.round(ms / (DT * 1000)); for (var i = 0; i < n; i++) step(); draw(); return window.__state(); };

  resize();
  if (T_GOAL >= 0) { var n = Math.round(T_GOAL / (DT * 1000)); for (var i = 0; i < n; i++) step(); }
  draw();
  if (FREEZE) { window.__frozen = true; return; }
  var last = performance.now(), acc = 0;
  (function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!D.paused) { acc += dt; while (acc >= DT) { step(); acc -= DT; } }
    draw();
  })(last);
})();
</script>
</body>
