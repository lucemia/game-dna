<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruin Skirmish ATB</title>
<style>
:root { --bg: #0b0a14; --ink: #dcd8f0; --dim: #8e88b4; --line: #2c2850; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; min-height: 100vh; }
#stage { width: 100%; height: calc(100vh - 92px); min-height: 224px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 6px; overflow: hidden; }
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; }
#bar b { color: var(--ink); }
.pad { display: flex; gap: 5px; }
.pad button { background: #221e40; color: var(--ink); border: 1px solid #3a3468; border-radius: 5px; padding: 6px 10px; font: inherit; touch-action: manipulation; }
@media (max-width: 760px) { #wrap { padding: 8px; } #stage { height: auto; min-height: 0; padding: 6px 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="256" height="224"></canvas></div>
  <div id="bar">
    <span><b>Ruin Skirmish</b> active-time battle: a full gauge opens that hero's commands.</span>
    <span>Arrows move, Z / Enter confirm, X / Esc back, <b>M</b> Active/Wait, <b>P</b> auto play. <b>?auto=1</b> to watch.</span>
    <span class="pad"><button data-key="up" aria-label="Up">&#9650;</button><button data-key="down" aria-label="Down">&#9660;</button><button data-key="ok">OK</button><button data-key="back">Back</button><button data-key="mode">Mode</button><button data-key="auto">Auto</button></span>
  </div>
</div>
<script>

  ['#262048', '#463a80', '#7666b8', '#a89ae0', '#e2dcff'],

    else add(hit - 14, 26, function (g, q) { RK.fxGlyph(g, t.x, t.footY, q, col); });
  }
}
function poseOf(c) {
  var vf = B.vf, an = B.anim && B.anim.act.actor === c.id ? B.anim : null, p = POS[c.id], tS = vf / FPS, st = game.ATB.get(c.id);
  var hurt = hitAt[c.id] != null && vf - hitAt[c.id] < 24 && !an;
  var white = hitAt[c.id] != null && (vf - hitAt[c.id] < 3 || (vf - hitAt[c.id] < 9 && Math.floor(vf / 2) % 2)) ? 0.62 : 0;
  var x = p.x;
  if (isParty(c)) {
    var pose = Math.floor(tS * (c.slot % 2 ? 1.6 : 2.3) + c.slot * 0.5) % 2 ? 'idle1' : 'idle0', walking = false;
    if (st.state === 'ready' || st.state === 'queued' || c.defending) pose = 'ready';
    if (B.result === 'win' && !c.dead) pose = Math.floor((vf - B.endAt) / 16) % 2 ? 'wind' : 'ready';
    if (an) {
      var q = (vf - an.f0) / an.n, hq = an.hit / an.n, mag = an.act.cmd === 'magic', fwd = mag ? 8 : 22;
      if (q < 0.22) { x -= Math.round(fwd * q / 0.22); walking = !mag; }
      else if (q < 0.78) { x -= fwd; pose = mag ? 'cast' : q < hq - 0.06 ? 'wind' : 'strike'; }
      else { x -= Math.round(fwd * (1 - (q - 0.78) / 0.22)); walking = !mag; }
      if (walking) pose = Math.floor(vf / 5) % 2 ? 'walkA' : 'walkB';
    } else if (hurt) pose = 'hurt';
    if (hurt && vf - hitAt[c.id] < 6) x += 2;
    return { spr: spriteOf(c, pose), x: x, y: p.y, white: white, walking: walking, fly: 0 };
  }
  var idle = Math.floor(tS * (c.look.type === 'bat' ? 9 : 2.2) + c.slot * 1.3) % 4, atk = 0;
  if (an) { var q2 = (vf - an.f0) / an.n, hq2 = an.hit / an.n; atk = q2 < hq2 - 0.1 ? 1 : q2 < hq2 + 0.25 ? 2 : 0; if (atk === 2) x += 6; }
  if (hurt && vf - hitAt[c.id] < 6) x -= 2;
  var fly = (RK.MON[c.look.type].fly || 0) + (c.look.type === 'bat' ? (idle === 2 ? -1 : idle === 0 ? 1 : 0) : 0);
  return { spr: spriteOf(c, { f: st.status === 'slow' ? 0 : idle, atk: atk, hurt: hurt }), x: x, y: p.y, fly: fly, white: white || game.ATB.flashAlpha(c.id) };
}
function resultBox() {
  var txt = B.result === 'win' ? 'Victory!' : 'The party has fallen', sub = B.result === 'win' ? 'The ruin falls quiet.' : 'Regrouping...';
  var w = Math.max(RK.textW(sub), RK.textW(txt)) + 24;
  return { name: 'result', x: Math.max(4, Math.min(POS.rowan.x - 40 - w, (W - w) >> 1)), y: 30, w: w, h: 34, txt: txt, sub: sub };
}

var plate = { w: 80, h: 13 }, field = RK.mkCanvas(W, FH), fg = field.getContext('2d');
function drawField(tSec) {
  var g = fg, S = ruinScene(W, FH), m = game.menu;
  g.imageSmoothingEnabled = false;
  RK.drawSceneBack(g, S, tSec); drawRuinTorch(g, S, tSec);
  var actors = B.all.slice().sort(function (a, b) { return POS[a.id].y - POS[b.id].y; }).map(function (c) { var o = poseOf(c); o.c = c; return o; });
  actors.forEach(function (o) {                      // contact shadows and guard rings under everyone
    if (o.c.dead && !isParty(o.c) && B.vf - deadAt[o.c.id] > 54) return;
    var rx = Math.max(4, Math.round(o.spr.w * (o.fly ? 0.2 : 0.3)));
    g.globalAlpha = 0.42; RK.oval(g, o.x, o.y, rx, Math.max(1, Math.round(rx * 0.25)), '#0a0612'); g.globalAlpha = 1;
    if (o.c.defending && !o.c.dead) { g.globalAlpha = 0.7; RK.fxGlyph(g, o.x, o.y, 0.5, '#90e2ff'); g.globalAlpha = 1; }
  });
  fx.forEach(function (e) { var q = (B.vf - e.f0) / e.n; if (q >= 0 && q < 1 && e.under) e.draw(g, q); });
  actors.forEach(function (o) {                      // actors, sorted by foot y
    var c = o.c, dy = o.fly;
    if (c.dead && deadAt[c.id] != null && B.vf >= deadAt[c.id]) {
      if (isParty(c)) RK.drawSprite(g, RK.heroKO(c.look.cls, c.look.tint, c.look.hair), o.x, o.y);
      else RK.drawDissolve(g, o.spr, o.x, o.y - dy, (B.vf - deadAt[c.id]) / 54);
      return;
    }
    if (o.walking) { g.globalAlpha = 0.35; RK.drawSprite(g, o.spr, o.x + 6, o.y); g.globalAlpha = 1; }
    RK.drawSprite(g, o.spr, o.x, o.y - dy);
    if (o.white) RK.drawSprite(g, o.spr, o.x, o.y - dy, { white: true, alpha: o.white });   // tinted flash, never a white blob
    var st = game.ATB.get(c.id).status, a = anchor(c.id);
    if (st) RK.fxStatus(g, st, { left: a.left, right: a.left + a.w, top: a.top }, tSec);
    var who = m ? m.id : game.ATB.acting();
    if (who === c.id && !B.result) RK.fxCursor(g, o.x, Math.round(o.y - dy - o.spr.ay + o.spr.top) - 8 + (Math.floor(tSec * 6) % 2));
  });
  game.ATB.drawEnemyGauges(g, B.mons.map(function (mm) { return { id: mm.id, x: POS[mm.id].x, footY: POS[mm.id].y }; }), FH);
  fx.forEach(function (e) { var q = (B.vf - e.f0) / e.n; if (q >= 0 && q < 1 && !e.under) e.draw(g, q); });
  parts.draw(g);
  if (m && m.stage === 'target' && Math.floor(B.vf / 8) % 4 !== 3) {
    var tt = anchor(m.tgt); if (tt && !tt.dead) RK.drawTargetHand(g, { left: tt.left, right: tt.left + tt.w, top: tt.top, cy: tt.cy }, W);
  }
  var bb = banner && B.vf - banner.f0 < banner.n ? RK.bannerBox(W, banner.txt) : null;
  pops.forEach(function (p) {
    var age = (B.vf - p.f0) * FRAME_MS; if (age < 0 || age > 1400) return;
    var hw = (p.kind === 'num' ? RK.numWidth(p.str) : RK.textW(p.str)) >> 1, x = RK.clamp(p.x, hw + 2, W - hw - 3), y = p.y;
    if (bb && y - 8 < bb.y + bb.h + 2 && x + hw > bb.x && x - hw < bb.x + bb.w) y = bb.y + bb.h + 10;
    if (p.kind === 'num') RK.drawPopNumber(g, p.str, x, RK.clamp(y, 4, FH - 12), age, { col: p.col, col2: p.col2 });
    else RK.drawPopText(g, p.str, x, RK.clamp(y, 4, FH - 12), age, p.col);
  });
  RK.drawSceneFront(g, S, tSec);
  var j = juice.sample(B.vf);
  RK.drawFlash(g, W, FH, j.flash, flashColor);
  if (bb) RK.drawBanner(g, W, banner.txt);
  plate = game.ATB.drawModePlate(g, 4, 4);
  if (B.result && B.vf - B.endAt > 60) {
    var r = resultBox();
    RK.drawWin(g, r.x, r.y, r.w, r.h); RK.drawText(g, r.txt, r.x + ((r.w - RK.textW(r.txt)) >> 1), 38, '#fff3a0'); RK.drawText(g, r.sub, r.x + ((r.w - RK.textW(r.sub)) >> 1), 50, '#ffffff');
  }
  return j;
}
function drawHud(g) {
  var y0 = FH, HH = H - FH, m = game.menu, row = function (i) { return y0 + PAD + 1 + i * ROW; };
  RK.rect(g, 0, y0, W, HH, '#05060f');
  RK.drawWin(g, 0, y0 + 1, LW, HH - 2);
  if (m) {                                            // left window: command list, spell list, or enemy names
    var c = byId(m.id);
    if (m.stage === 'sub' || (m.stage === 'target' && m.cmd === 1)) {
      SPELLS.forEach(function (s, i) { var col = c.mp >= s.mp ? '#ffffff' : '#7a84b8'; RK.drawText(g, s.name, 18, row(i), col); RK.drawText(g, String(s.mp), LW - 9 - RK.textW(String(s.mp)), row(i), col); });
      RK.drawHand(g, 15, row(m.sub) + 3);
    } else {
      CMDS.forEach(function (s, i) { RK.drawText(g, s, 18, row(i), '#ffffff'); });
      RK.drawHand(g, 15, row(m.cmd) + 3);
    }
  } else living('enemy').forEach(function (e, i) { RK.drawText(g, e.name, 9, row(i), '#ffffff'); });
  var rx = LW + 1, rw = W - rx - 1, nameW = Math.max.apply(null, B.party.map(function (p) { return RK.textW(p.name); }));
  RK.drawWin(g, rx, y0 + 1, rw, HH - 2);
  B.party.forEach(function (c, i) {                   // right window: name | HP | gauge | MP, laid out by the module (no overlaps)
    var y = row(i), up = m && m.id === c.id, mp = String(c.mp), mx = rx + rw - 9 - RK.textW(mp);
    var L = game.ATB.layoutRow({ x: rx + 13, y: y, nameW: nameW, hpW: RK.textW('9999'), right: mx - 11 - 6, h: 6 });
    if (up && Math.floor(B.vf / 10) % 3 !== 2) RK.drawHand(g, rx + 11, y + 3);
    RK.drawText(g, c.name, L.nameX, y, c.dead ? '#8a90b8' : up ? '#fff3a0' : '#ffffff');
    var hp = String(c.hp);
    RK.drawText(g, hp, L.hpRight - RK.textW(hp), y, c.dead ? '#ff8a8a' : c.hp * 4 < c.maxhp ? '#ffd860' : '#ffffff');
    game.ATB.drawGauge(g, c.id, L.gauge.x, L.gauge.y, L.gauge.w, L.gauge.h);
    RK.drawSmall(g, 'MP', mx - 11, y + 2, '#9aa4d8'); RK.drawText(g, mp, mx, y, '#c8d0ff');
  });
}

// Screen: native buffer, one integer scale, square pixels; the field shakes, the HUD does not.
var canvas = document.getElementById('screen'), stage = document.getElementById('stage');
var buf = RK.mkCanvas(W, H), bg = buf.getContext('2d'), out = canvas.getContext('2d'), lastShake = { sx: 0, sy: 0 };
function present(sh) {
  lastShake = sh || lastShake;
  var dpr = window.devicePixelRatio || 1, ah = matchMedia('(max-width: 760px)').matches ? 1e9 : (stage.clientHeight || H);
  var s = Math.max(1, Math.floor(Math.min((stage.clientWidth || W) * dpr / W, ah * dpr / H)));
  if (canvas.width !== W * s) { canvas.width = W * s; canvas.height = H * s; }
  canvas.style.width = (W * s / dpr) + 'px'; canvas.style.height = (H * s / dpr) + 'px';
  out.imageSmoothingEnabled = false; out.fillStyle = '#000'; out.fillRect(0, 0, canvas.width, canvas.height);
  out.save(); out.beginPath(); out.rect(0, 0, W * s, FH * s); out.clip();
  out.drawImage(buf, 0, 0, W, FH, lastShake.sx * s, lastShake.sy * s, W * s, FH * s); out.restore();
  out.drawImage(buf, 0, FH, W, H - FH, 0, FH * s, W * s, (H - FH) * s);
}
addEventListener('resize', function () { present(); });
function render() {
  var j = drawField(B.vf / FPS);
  bg.drawImage(field, 0, 0);
  game.each('draw', bg, 'fx');                        // EXTENSION POINT 2: addon effects, after actors, before the HUD
  drawHud(bg);
  game.each('draw', bg, 'overlay');                   // addon overlays above everything
  present({ sx: game.flags.builtinShake ? j.sx : 0, sy: game.flags.builtinShake ? j.sy : 0 });
}

/* ================================ 9. INPUT ================================ */
// Keys are queued on keydown and handled in the next tick, so a 0 ms tap still counts.
var KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyZ: 'ok', Enter: 'ok', Space: 'ok', KeyX: 'back', Escape: 'back', Backspace: 'back', KeyM: 'mode', KeyP: 'auto' };
var inputCount = 0;
function press(k) { inputCount++; keys.push(k); }
addEventListener('keydown', function (e) { var k = KEYMAP[e.code]; if (k) { e.preventDefault(); press(k); } });
document.querySelectorAll('[data-key]').forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.preventDefault(); press(b.dataset.key); }); });

/* ================================ 10. BOOT ================================ */
// Boot waits for DOMContentLoaded, so the ADDONS slot <script> right after this one (in index.html) registers
// its addons first: they see the first onBattleStart and every ?t= fast-forwarded frame. Late registration
// (from the console, or after load) also works but misses what already happened.
function boot() {
newBattle();
var target = Math.round(+(Q.get('t') || 0) / FRAME_MS);
while (game.clock.frame < target) tick();             // ?t= fast-forwards the deterministic 60 Hz simulation
render();
game.input = { get count() { return inputCount; } };
game.progress = function () { return game.clock.frame + '|' + B.wave + '|' + B.all.map(function (a) { return a.hp; }).join(','); };
window.__game = game;
if (Q.get('freeze') !== '1') {
  var last = null, acc = 0;
  requestAnimationFrame(function loop(ts) {
    if (last != null) acc += Math.min(250, ts - last);
    last = ts;
    while (acc >= FRAME_MS) { tick(); acc -= FRAME_MS; }
    render(); requestAnimationFrame(loop);
  });
}
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

   sees the first onBattleStart and every ?t=&freeze=1 frame. Example:
     GAME.addons.push({ name: 'my-addon', onHit: function (ev, game) {}, draw: function (g, layer, game) {} });
