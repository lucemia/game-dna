<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billboard sprites in 3D</title>
<style>
  :root { --ink: #f3ead8; --dim: #b9ad98; --panel: rgba(22, 18, 30, 0.78); --edge: rgba(255, 220, 160, 0.22); --accent: #ffc56b; }
  html, body { margin: 0; height: 100%; background: #120e1a; overflow: hidden; color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; }
  #gl { cursor: grab; touch-action: none; }
  #gl.drag { cursor: grabbing; }
  .card { position: absolute; left: 16px; top: 14px; padding: 9px 14px 10px; background: linear-gradient(180deg, rgba(34, 26, 44, 0.82), rgba(20, 16, 28, 0.82)); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); pointer-events: none; }
  .card h1 { margin: 0; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .card p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  #panel { position: absolute; right: 14px; top: 14px; width: 236px; padding: 10px 12px 12px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  #panel summary { cursor: pointer; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; font-size: 12px; list-style: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: ' \25BE'; color: var(--dim); }
  #panel label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; margin-top: 8px; color: var(--dim); font-size: 12px; }
  #panel select, #panel input[type=range] { width: 100%; min-width: 0; }
  #panel select { background: #2a2234; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 2px 4px; font: inherit; }
  #panel input[type=range] { accent-color: var(--accent); }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1; background: #3a2c22; color: var(--ink); border: 1px solid var(--edge); border-radius: 7px; padding: 5px 0; font: inherit; cursor: pointer; }
  .row button:hover { background: #4a3828; }
  .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); color: rgba(243, 234, 216, 0.72); font-size: 12px; background: rgba(18, 14, 26, 0.55); padding: 4px 12px; border-radius: 99px; pointer-events: none; white-space: nowrap; }
  #nogl { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--ink); font-size: 15px; }
  @media (max-width: 560px) {
    #panel { left: 16px; right: 16px; top: auto; bottom: 44px; width: auto; }
    .card { left: 12px; top: 10px; padding: 7px 11px 8px; }
    .card h1 { font-size: 13px; }
    .hint { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="card"><h1>Billboard sprites in 3D</h1><p>Painted characters standing in a 3D diorama</p></div>
  <details id="panel">
    <summary>Settings</summary>
    <label>Filtering <select id="p-filter"><option value="smooth">Smooth</option><option value="crisp">Pixel crisp</option></select></label>
    <label>Billboard <select id="p-mode"><option value="camera">Screen-parallel</option><option value="cylinder">Cylindrical</option></select></label>
    <label>Shadow <select id="p-shadow"><option value="blob">Soft blob</option><option value="both">Blob + sprite</option><option value="sprite">Sprite</option><option value="none">None</option></select></label>
    <label>Orbit sway &deg; <input id="p-orbit" type="range" min="0" max="60" step="1"></label>
    <label>Camera pitch <input id="p-pitch" type="range" min="18" max="55" step="1"></label>
    <label>Tilt-shift <input id="p-tilt" type="range" min="0" max="1" step="0.05"></label>
    <label>Torch light <input id="p-probe" type="range" min="0" max="1" step="0.05"></label>
    <label>Hit flash ms <input id="p-flash" type="range" min="80" max="420" step="10"></label>
    <div class="row"><button id="b-replay">Replay</button><button id="b-pause">Pause</button></div>
  </details>
  <div class="hint">Drag to turn the camera &middot; scroll to zoom</div>
  <div id="nogl">This demo needs WebGL, which is not available in this browser.</div>
</div>
<script src="three.min.js"></script>
<script src="../../../demo-kit/kit-art.js"></script>
<script src="../../cutout-characters/module/cutout-characters.js"></script>
<script src="../../cutout-characters/assets/pack.js"></script>
<script src="../../../demo-kit/kit.js"></script>
<script src="../../bark-bubbles/module/bark-bubbles.js"></script>
<script src="../module/billboard-sprites-3d.js"></script>
<script>
(function () {
  'use strict';

  var PAR = {
    filter: Q.get('filter') || 'smooth', mode: Q.get('mode') || 'camera', shadow: Q.get('shadow') || 'blob',

  function hash(x, z) { var h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return h - Math.floor(h); }

    var a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(34, 16 / 9, 0.3, 200);

  // sky dome: violet top, warm horizon band, sun glow on the west
  var skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color('#1f2350') }, mid: { value: new THREE.Color('#6a4f86') }, hor: { value: new THREE.Color('#f2a167') }, sun: { value: new THREE.Vector3(-0.75, 0.12, -0.65).normalize() } },

  var sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), skyMat); scene.add(sky);

  var hemi = new THREE.HemisphereLight('#a9a4e0', '#4a3a2c', 0.75); scene.add(hemi);
  var sun = new THREE.DirectionalLight('#ffc28a', 1.55); sun.position.set(-10, 9, -8); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); var SC = sun.shadow.camera; SC.left = -15; SC.right = 15; SC.top = 15; SC.bottom = -15; SC.near = 1; SC.far = 40; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sun.shadow.radius = 3;

  var TS = 56, TN = 140, tg = new THREE.PlaneGeometry(TS, TS, TN, TN); tg.rotateX(-Math.PI / 2);
  var tp = tg.attributes.position, tcol = new Float32Array(tp.count * 3), C = new THREE.Color();
  var G1 = new THREE.Color('#5f8a3a'), G2 = new THREE.Color('#86a547'), G3 = new THREE.Color('#3f6a33'), DIRT = new THREE.Color('#8a6a48'), STONE = new THREE.Color('#9d927f'), MUD = new THREE.Color('#4c4a3a');
  function pathK(x, z) {   // path from the south-east into the plaza and on to the campfire
    var d1 = segDist(x, z, 13, 12, 3.4, 2.6), d2 = segDist(x, z, -1, 1.2, -4.6, 2.4), d3 = segDist(x, z, 0.4, -4.8, 0.4, -14);

  for (var i = 0; i < tp.count; i++) {
    var x = tp.getX(i), z = tp.getZ(i), y = heightAt(x, z); tp.setY(i, y);
    var n = fbm(x * 0.35 + 3, z * 0.35), n2 = vnoise(x * 1.7, z * 1.7);
    C.copy(G3).lerp(G1, Math.min(1, n * 1.4)).lerp(G2, Math.max(0, n2 - 0.55) * 1.6);
    var pk = pathK(x, z); if (pk > 0) C.lerp(DIRT, Math.min(1, pk * 1.5) * (0.75 + n2 * 0.25));
    var k = plazaK(x, z); if (k < 1) C.lerp(STONE.clone().lerp(MUD, n2 * 0.35), (1 - k) * (1 - k) * 0.9);
    if (y < -0.35) C.lerp(MUD, Math.min(1, (-0.35 - y) * 2));

  }
  tg.setAttribute('color', new THREE.BufferAttribute(tcol, 3)); tg.computeVertexNormals();
  var terrain = new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true })); terrain.receiveShadow = true; scene.add(terrain);
  // pond
  var water = new THREE.Mesh(new THREE.CircleGeometry(3.3, 48), new THREE.MeshPhongMaterial({ color: '#3c5f86', specular: '#ffd2a0', shininess: 90, transparent: true, opacity: 0.86 }));
  water.rotation.x = -Math.PI / 2; water.position.set(-8.5, -0.42, 6.5); scene.add(water);

  /* plaza flagstones (instanced, slight height / colour jitter) */

  for (var gx = -6; gx <= 6; gx++) for (var gz = -7; gz <= 5; gz++) {

  }

  function block(w, h, d, x, y, z, ry, mat) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || stoneMat); m.position.set(x, y, z); m.rotation.y = ry || 0; m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }
  function pillar(x, z, h, broken) {

    block(1.0, 0.3, 1.0, x, g0 + 0.15, z, 0.1, stoneDark);
    for (var i = 0; i < n; i++) { var m = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.38, seg - 0.03, 10), stoneMat); m.position.set(x + (rnd(i + x) - 0.5) * 0.04, g0 + 0.3 + seg * (i + 0.5), z); m.rotation.y = rnd(i * 7 + z) * 3; m.castShadow = m.receiveShadow = true; scene.add(m); }
    var top = g0 + 0.3 + seg * n;
    if (!broken) { block(1.0, 0.28, 1.0, x, top + 0.14, z, 0.05, stoneDark); return top + 0.28; }
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.37, 0.22, 10, 1, false), moss); cap.position.set(x, top + 0.02, z); scene.add(cap);

  }
  var aT = pillar(-1.3, -6.6, 3.3, false); pillar(2.1, -6.6, 3.3, false);
  block(4.4, 0.55, 1.1, 0.4, aT + 0.27, -6.6, 0, stoneMat); block(4.5, 0.12, 1.2, 0.4, aT + 0.6, -6.6, 0, moss);
  pillar(-4.6, -3.8, 1.6, true); pillar(5.0, -3.2, 2.2, true); pillar(-5.4, 1.2, 1.0, true); pillar(4.4, -6.0, 1.2, true);
  for (var w = 0; w < 7; w++) { var wx = 3.2 + w * 0.72, wz = -7.6 + w * 0.12; block(0.7, 0.42 + rnd(w) * 0.32, 0.55, wx, heightAt(wx, wz) + 0.22, wz, 0.15, w % 2 ? stoneMat : stoneDark); }
  for (var w2 = 0; w2 < 5; w2++) { var wx2 = -6.2 - w2 * 0.66, wz2 = -5.6 + w2 * 0.4; block(0.66, 0.36 + rnd(w2 + 9) * 0.4, 0.5, wx2, heightAt(wx2, wz2) + 0.2, wz2, -0.5, w2 % 2 ? stoneMat : stoneDark); }
  // fallen column
  var fc = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.36, 2.2, 10), stoneMat); fc.rotation.set(0, 0.6, Math.PI / 2); fc.position.set(-3.6, heightAt(-3.6, -6.4) + 0.32, -6.4); fc.castShadow = fc.receiveShadow = true; scene.add(fc);

  function tree(x, z, s, i) {

    for (var k = 0; k < 3; k++) {
      var b = new THREE.Mesh(new THREE.IcosahedronGeometry((0.95 - k * 0.18) * s, 1), leafMats[(i + k) % 4]);

    for (var k = 0; k < 3; k++) { var c = new THREE.Mesh(new THREE.ConeGeometry((1.0 - k * 0.24) * s, 1.3 * s, 8), leafMats[(i + k + 3) % 4]); c.position.set(x, g0 + (1.2 + k * 0.7) * s, z); c.rotation.y = rnd(i * 2 + k); c.castShadow = true; scene.add(c); }
  }

  for (var p = 0; p < 16; p++) { var ang = -2.6 + p * 0.33, R = 15 + rnd(p) * 4; pine(Math.cos(ang) * R, Math.sin(ang) * R, 1.3 + rnd(p * 3) * 0.6, p); }

  function rock(x, z, s, i) { var g = new THREE.DodecahedronGeometry(s, 1), pa = g.attributes.position; for (var k = 0; k < pa.count; k++) { var f = 0.8 + rnd(i * 97 + k) * 0.35; pa.setXYZ(k, pa.getX(k) * f, pa.getY(k) * f * 0.7, pa.getZ(k) * f); } g.computeVertexNormals(); var m = new THREE.Mesh(g, rockMat); m.position.set(x, heightAt(x, z) + s * 0.25, z); m.rotation.y = i; m.castShadow = m.receiveShadow = true; scene.add(m); }
  [[-6.8, -2.2, 0.55], [6.6, 1.8, 0.45], [-7.2, 4.2, 0.7], [3.4, 7.6, 0.4], [-2.4, -8.6, 0.6], [8.2, -5.2, 0.5], [-5.5, 7.8, 0.35], [6.1, 5.8, 0.3]].forEach(function (r, i) { rock(r[0], r[1], r[2], i + 1); });
  var bushMat = [new THREE.MeshLambertMaterial({ color: '#4d7a31', flatShading: true }), new THREE.MeshLambertMaterial({ color: '#628f3a', flatShading: true })];
  [[-7.4, -0.6], [-6.9, -3.2], [7.6, 0.4], [-2.2, 7.2], [5.4, -8.2], [-8.6, 2.6], [1.8, 8.6], [8.6, 5.6]].forEach(function (b, i) {
    for (var k = 0; k < 3; k++) { var m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42 + rnd(i * 4 + k) * 0.25, 0), bushMat[(i + k) % 2]); m.position.set(b[0] + (k - 1) * 0.42, heightAt(b[0], b[1]) + 0.3, b[1] + (rnd(i + k * 3) - 0.5) * 0.5); m.castShadow = true; m.receiveShadow = true; scene.add(m); }
  });
  // grass tufts: instanced crossed blades, coloured per instance
  var bladeG = new THREE.ConeGeometry(0.05, 0.42, 3); bladeG.translate(0, 0.21, 0);
  var tuftN = 900, tufts = new THREE.InstancedMesh(bladeG, new THREE.MeshLambertMaterial({ color: '#ffffff' }), tuftN), placed = 0;
  for (var gi = 0; placed < tuftN && gi < 6000; gi++) {
    var tx = (rnd(gi * 3 + 1) - 0.5) * 34, tz = (rnd(gi * 7 + 2) - 0.5) * 30;
    if (plazaK(tx, tz) < 0.35 || pathK(tx, tz) > 0.35 || heightAt(tx, tz) < -0.3) continue;

  var PROBE_IDS = ['sword', 'knight', 'wisp', 'slime'];
  function setupProbe() {
    CAST.concat(PROPS).forEach(function (c) { bb.set(c.id, { visible: false }); });
    S = {}; CUES = []; barks.clear(); barks = null;
    PROBE_IDS.forEach(function (k, i) { bb.add({ id: 'p-' + k, source: B3.kitSource(Kit, k, { px: 300 }), h: k === 'slime' ? 0.8 : k === 'wisp' ? 0.8 : HERO_H, x: -3 + i * 2, z: 0 }); });
    scene.traverse(function (o) { if ((o.isMesh || o.isSprite || o.isPoints) && o !== terrain && o !== sm && o !== sky && !(o.parent && o.parent === bb.group)) o.visible = false; });
    window.__flies = function () {};
    cam.look.set(0, 0.6, 0); cam.dist = 13; PAR.tilt = 0;
  }
  /* __probeFacing(yawDeg, dirDeg): move each probe actor 0.8 units along the world direction dirDeg, under camera yaw yawDeg */
  window.__probeFacing = function (yawDeg, dirDeg) {
    cam.yaw = yawDeg; cam.dragYaw = 0; placeCamera();
    var r = dirDeg * Math.PI / 180, dx = Math.sin(r), dz = Math.cos(r);
    PROBE_IDS.forEach(function (k, i) { var id = 'p-' + k; bb.move(id, -3 + i * 2 - dx * 2, -dz * 2); bb.setTarget(id, null); bb.setMove(id, null); });
    bb.update(400);    // teleport: no walk
    for (var s = 0; s < 12; s++) { PROBE_IDS.forEach(function (k, i) { var id = 'p-' + k, a = bb.get(id); bb.move(id, a.x + dx * 0.07, a.z + dz * 0.07); }); bb.update(STEP); }
    render();
    var st = bb.state(); st.camYawDeg = yawDeg; st.dirDeg = dirDeg; st.camRight = (function () { var v = new THREE.Vector3(); camera.matrixWorld.extractBasis(v, new THREE.Vector3(), new THREE.Vector3()); return [v.x, v.z]; })();
    return st;
  };

  /* ------------ feet check: each grounded actor rendered alone, lowest opaque row vs projected ground contact ------------ */
  window.__feetCheck = function () {
    var dpr = renderer.getPixelRatio(), W = Math.round(VW * dpr), H = Math.round(VH * dpr), T = new THREE.WebGLRenderTarget(W, H), buf = new Uint8Array(W * H * 4), out = [];
    var vis = []; scene.traverse(function (o) { if (o.isMesh || o.isSprite || o.isPoints) vis.push([o, o.visible]); });
    var bgFog = scene.fog; scene.fog = null; sky.visible = false;
    bb.ids().filter(function (id) { var a = bb.get(id); return a && a.mesh.visible; }).forEach(function (id) {
      var a = bb.get(id);
      if (a.airborne) { out.push({ id: id, skipped: 'airborne (hop / hover)' }); return; }
      if (a.alpha < 0.6) { out.push({ id: id, skipped: 'fading out (alpha ' + a.alpha.toFixed(2) + ')' }); return; }
      var pc = new THREE.Vector3(a.x, a.y, a.z).project(camera), pcy = (1 - pc.y) / 2 * H;
      if (pcy > H - 2 || pcy < 2 || pc.x < -1 || pc.x > 1) { out.push({ id: id, skipped: 'ground contact off screen' }); return; }
      vis.forEach(function (v) { v[0].visible = false; }); a.mesh.visible = true;
      renderer.setRenderTarget(T); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera); renderer.readRenderTargetPixels(T, 0, 0, W, H, buf); renderer.setRenderTarget(null);
      var low = -1, minX = W, maxX = -1;
      for (var y = 0; y < H && low < 0; y++) for (var x = 0; x < W; x++) if (buf[(y * W + x) * 4 + 3] > 127) { low = y; break; }   // y = 0 is the bottom row in GL
      var v = new THREE.Vector3(a.x, a.y, a.z).project(camera), cy = (1 - v.y) / 2 * H, cx = (v.x + 1) / 2 * W;
      var lowTop = low < 0 ? null : H - 1 - low + 1;   // bottom edge of the lowest opaque pixel row, top-down device px
      out.push({ id: id, contactY: +cy.toFixed(2), contactX: +cx.toFixed(1), lowestOpaqueBottom: lowTop, diffPx: lowTop == null ? null : +(lowTop - cy).toFixed(2), anim: bb.state().actors.filter(function (s) { return s.id === id; })[0].anim });
    });
    vis.forEach(function (v) { v[0].visible = v[1]; }); scene.fog = bgFog; sky.visible = true; renderer.setClearColor(0x000000, 1); T.dispose(); render();
    return { dpr: dpr, actors: out };
  };

  window.__state = function () { var s = bb.state(); s.t = Math.round(simT); s.actors = s.actors.filter(function (a) { return a.visible; }); return s; };
  window.__render = function () { render(); };
  /* __advance(n, every): n fixed steps, rendering every `every` steps like live play (checks/still-vs-live.py) */
  window.__advance = function (n, every) { for (var i = 1; i <= n; i++) { step(STEP); if (i % (every || 1) === 0 || i === n) { window.__flies(); render(); } } }; window.__bb = bb; window.__barks = function () { return barks; };
  window.__perf = function (n) { var ts = []; for (var i = 0; i < (n || 60); i++) { var t0 = performance.now(); step(STEP); window.__flies(); render(); renderer.getContext().readPixels(0, 0, 1, 1, renderer.getContext().RGBA, renderer.getContext().UNSIGNED_BYTE, new Uint8Array(4)); ts.push(performance.now() - t0); } ts.sort(function (a, b) { return a - b; }); return ts[Math.floor(ts.length / 2)]; };

  /* ------------ controls ------------ */
  function bind(id, key, apply) { var el = document.getElementById(id); el.value = PAR[key]; el.addEventListener('input', function () { PAR[key] = el.type === 'range' ? +el.value : el.value; apply(PAR[key]); }); }
  bind('p-filter', 'filter', function (v) { bb.setParams({ filter: v }); });
  bind('p-mode', 'mode', function (v) { bb.setParams({ mode: v }); });
  bind('p-shadow', 'shadow', function (v) { bb.setParams({ shadow: v }); });
  bind('p-orbit', 'orbit', function () {});
  bind('p-pitch', 'pitch', function (v) { cam.pitch = v; });
  bind('p-tilt', 'tilt', function (v) { if (post) post.uniforms.uTilt.value = v; });
  bind('p-probe', 'probe', function (v) { bb.setParams({ lightProbe: v }); });
  bind('p-flash', 'flash', function (v) { bb.setParams({ flashMs: v }); });
  document.getElementById('b-replay').onclick = function () { resetStory(); };
  document.getElementById('b-pause').onclick = function () { paused = !paused; this.textContent = paused ? 'Play' : 'Pause'; };
  if (Q.get('panel') === '1') document.getElementById('panel').open = true;
  if (FREEZE) document.querySelector('.hint').style.display = 'none';

  Kit.ready(boot);
})();
</script>
