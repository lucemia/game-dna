<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Cavern Battle</title>
<style>
:root { --bg: #0d0b14; --text: #ece8f6; --dim: #9a93b4; --line: #3a3352; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { background: radial-gradient(1000px 500px at 50% -10%, #241c3a 0%, var(--bg) 60%) fixed, var(--bg); min-height: 100vh; }
#stage { display: flex; flex-direction: column; align-items: center; padding: 16px; }
.frame { padding: 6px; background: linear-gradient(#2a2340, #15111f); border-radius: 8px; box-shadow: 0 0 0 1px var(--line), 0 18px 50px #00000080; max-width: 100%; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 3px; touch-action: manipulation; }
p { color: var(--dim); font-size: 12.5px; margin: 10px 0 0; text-align: center; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--text); }
@media (max-width: 560px) { #stage { padding: 12px 8px; } .frame { padding: 3px; } }
</style>
</head>
<body>
<section id="stage">
  <div class="frame"><canvas id="cv" width="256" height="224" aria-label="Turn-based battle"></canvas></div>
  <p><kbd>↑</kbd> <kbd>↓</kbd> choose · <kbd>Enter</kbd> confirm · <kbd>Esc</kbd> back · or tap commands and enemies</p>
</section>
<script>
/*COMMON*/
/*MAIN*/
</script>
</body>
</html>
