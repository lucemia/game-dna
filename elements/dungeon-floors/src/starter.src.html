<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternfall</title>
<style>
:root { --bg: #0b0810; --ink: #f0e6d8; --dim: #a898b8; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; min-height: 100vh; }
#stage { width: 100%; max-width: 1600px; display: flex; align-items: center; justify-content: center; }
#screen { display: block; image-rendering: pixelated; touch-action: none; background: #08060d; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
#bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; max-width: 100%; }
#bar b { color: var(--ink); }
.pad { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; }
.pad button, .acts button { background: #241a30; color: var(--ink); border: 1px solid #54426c; border-radius: 6px; height: 40px; font: inherit; touch-action: manipulation; }
.acts { display: flex; flex-direction: column; gap: 4px; }
.acts button { padding: 0 12px; }
#touch { display: none; gap: 14px; align-items: center; justify-content: center; }
@media (max-width: 760px) { #wrap { padding: 8px 4px; } #touch { display: flex; } .keys { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="420" height="240"></canvas></div>
  <div id="touch">
    <div class="pad"><button data-key="upleft" aria-label="Up left">&#8598;</button><button data-key="up" aria-label="Up">&#9650;</button><button data-key="upright" aria-label="Up right">&#8599;</button><button data-key="left" aria-label="Left">&#9664;</button><button data-key="wait" aria-label="Wait">&#183;</button><button data-key="right" aria-label="Right">&#9654;</button><button data-key="downleft" aria-label="Down left">&#8601;</button><button data-key="down" aria-label="Down">&#9660;</button><button data-key="downright" aria-label="Down right">&#8600;</button></div>
    <div class="acts"><button data-key="potion">Tonic</button><button data-key="map">Map</button><button data-key="auto">Auto</button></div>
  </div>
  <div id="bar">
    <span><b>Lanternfall</b>: go down five floors and break the Hollow Crown. Bump a monster to fight it, bump a chest or a door to open it.</span>
    <span class="keys"><b>Arrows / WASD</b> move (hold to walk), <b>numpad 7 9 1 3</b> or <b>Home PgUp End PgDn</b> diagonals, <b>Space</b> wait, <b>Q</b> tonic, <b>M</b> map, <b>P</b> auto play, tap a tile to walk there. <b>?auto=1</b> to watch.</span>
  </div>
</div>
<script>
/*@@MODULE@@*/
</script>
<script>
/*@@GAME@@*/
</script>
<script>

   Paste addon modules here (or add <script src> tags right above this block) and register each one with
   GAME.addons.push({...}). New content goes here too: GAME.addRoom(id, def), GAME.addMonster(id, def), GAME.addItem(id, def).
   This block runs after window.GAME exists and BEFORE the game boots, so addons and content see the first floor and every
   ?t=&freeze=1 fast-forwarded frame. Hooks: see README.md "Extension points". */
</script>
</body>
</html>
