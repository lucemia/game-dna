<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thistledown Acre</title>
<style>
:root { --bg: #10140c; --ink: #f4ead8; --dim: #b8ac8c; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; min-height: 100vh; }
#stage { width: 100%; max-width: 1600px; display: flex; align-items: center; justify-content: center; }
#screen { display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); touch-action: none; background: #000; image-rendering: pixelated; }
#bar { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; max-width: 100%; }
#bar b { color: var(--ink); }
#info { display: none; width: 100%; max-width: 640px; text-align: center; font-size: 13px; color: var(--ink); }
#info b { color: #ffe7b0; } #info .dim { color: var(--dim); }
@media (max-width: 760px) { #wrap { padding: 4px 4px 8px; gap: 4px; } #bar .keys { display: none; } #info { display: block; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="960" height="540"></canvas></div>
  <div id="info" aria-live="polite"></div>
  <div id="bar">
    <span><b>Thistledown Acre</b>: tap a tile to walk there or work it; tap the hotbar to switch tools.</span>
    <span class="keys"><b>Arrows</b> walk (a tap turns), <b>Z</b> use the tool / ship / buy / sleep, <b>1-4</b> or <b>Tab</b> tools, <b>Q</b> next seed, <b>X</b> back, <b>P</b> auto play.</span>
  </div>
</div>
<script src="art/pixel-scene.js"></script>

</script>

</html>
