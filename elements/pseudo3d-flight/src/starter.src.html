function drawSparks() {   // wisp strike: a white-gold star burst on the wing tip, a ring, and the wisp bursting into violet puffs beside it

    if (p.f < 8) { const L = p.f < 4 ? 11 : 7; g.fillStyle = INK; g.fillRect(X - L - 1, Y - 2, 2 * L + 3, 5); g.fillRect(X - 2, Y - L - 1, 5, 2 * L + 3);

}
// title logo: 2x pixel letters with a dark outline and a gold-to-cream ramp, a wing flourish and an envelope seal
let LOGO = null;
function drawLogo() {
  if (!LOGO) {
    const c = document.createElement('canvas'); c.width = 200; c.height = 56; const q = c.getContext('2d');

    for (const i of m) { d[i * 4] = 26; d[i * 4 + 1] = 20; d[i * 4 + 2] = 40; d[i * 4 + 3] = 255; } q.putImageData(id, 0, 0);

  }

function drawPops() { for (const p of S.pops) { const an = p.id ? game.anchorOf(p.id) : null; if (an) { p.x = an.x; p.y = an.top - 2; }   // follow the mount as it banks

  } else {

      text(won ? 'ALL LETTERS DELIVERED' : 'GROUNDED', 128, 76, '#ffffff', won ? '#ffe070' : '#ff8a6a', 'center');
      text(won ? 'TIME ' + Math.floor((S.endT || S.t) / 60) + 'S' : 'YOUR MOUNT IS SPENT', 128, 96, '#c8d4ff', '#98a8e0', 'center');
      text('FLIGHTS ' + S.flights + '  HITS ' + S.hits, 128, 110, '#c8d4ff', '#98a8e0', 'center'); text('PRESS Z', 128, 136, '#fff4c8', '#e8c870', 'center');
    }

function stateJSON() { return { sparks: S.sparks.map(p => [Math.round(p.x), Math.round(p.y), p.f]), scene: S.scene, phase: game.phase, progress: +fl.progress.toFixed(3), delivered: S.delivered, stamina: S.stamina, flights: S.flights, hits: S.hits, frame: game.frame, auto: game.auto,
