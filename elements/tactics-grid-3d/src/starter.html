//   6. INPUT               keyboard, mouse, touch, the input chain

// =====================================================================================================

const Q = new URLSearchParams(location.search);

    '432100001355',
    '432210012344',

    'ggggdwwdgsss',
    'gggddddddsss',
    'ggggdwwdggss',
    'ggggdwwdgggs',
    'gggggsssgggg',

    'ggggdwwdgggg',
    'gggddwwddggg',
    'ggddwwwwddgg',
    'ggdwwwwwwdgg',

    '.r..........',
    '...........P',
    '.P..........']

// side 'a' = player (blue), 'b' = enemy (red). rng = [min, max] Manhattan. magic halves the target's DEF.
const ROSTER = [
  { id: 'aldric', name: 'Aldric', cls: 'knight', side: 'a', x: 1, z: 7, hp: 34, atk: 14, def: 7, mv: 4, jump: 2, rng: [1, 1] },
  { id: 'brenna', name: 'Brenna', cls: 'lancer', side: 'a', x: 2, z: 8, hp: 28, atk: 13, def: 4, mv: 5, jump: 3, rng: [1, 1] },
  { id: 'corin', name: 'Corin', cls: 'knight', side: 'a', x: 2, z: 6, hp: 34, atk: 13, def: 7, mv: 4, jump: 2, rng: [1, 1] },
  { id: 'dessa', name: 'Dessa', cls: 'lancer', side: 'a', x: 0, z: 8, hp: 28, atk: 13, def: 4, mv: 5, jump: 3, rng: [1, 1] },
  { id: 'gorrak', name: 'Gorrak', cls: 'brute', side: 'b', x: 9, z: 4, hp: 30, atk: 13, def: 4, mv: 4, jump: 2, rng: [1, 1] },
  { id: 'mukka', name: 'Mukka', cls: 'brute', side: 'b', x: 10, z: 2, hp: 30, atk: 12, def: 4, mv: 4, jump: 2, rng: [1, 1] },
  { id: 'vesh', name: 'Vesh', cls: 'shaman', side: 'b', x: 11, z: 3, hp: 20, atk: 11, def: 2, mv: 4, jump: 2, rng: [1, 2], magic: true },
  { id: 'ilza', name: 'Ilza', cls: 'shaman', side: 'b', x: 11, z: 0, hp: 20, atk: 10, def: 2, mv: 4, jump: 2, rng: [1, 2], magic: true }
];
const CLASS_NAME = { knight: 'Knight', lancer: 'Lancer', archer: 'Archer', brute: 'Brute', shaman: 'Shaman' };
// class -> {look: built-in model, attack: 'melee' | 'arrow' | 'bolt'}; addons add classes with GAME.addClass
const CLASS_DEF = { knight: { look: 'knight', attack: 'melee' }, lancer: { look: 'lancer', attack: 'melee' }, archer: { look: 'archer', attack: 'arrow' }, brute: { look: 'brute', attack: 'melee' }, shaman: { look: 'shaman', attack: 'bolt' } };

// ---------- 2. EXTENSION POINTS ----------
// Addons push one object onto GAME.addons in the ADDONS SLOT (below this script, before boot). Every member is optional:
//   onHit(ev, game)        every HP change, on the impact frame, after HP changed (see applyHit)
//   onMove(ev, game)       every tile step of a walk: {id, from:{x,z}, to:{x,z}, step, steps, hop, dh, dir:[dx,dz]}; and ev.end = true when the walk ends
//   update(game, info)     every 60 Hz step; info = {dt (ms, 0 while frozen), frozen}
//   draw(ctx, game)        2D overlay, world-effects layer: after HP bars and built-in numbers, before the HUD (logical 960x540 px)
//   drawUI(ctx, game)      2D overlay, top UI layer: after the HUD and menus, before banners
//   scene3d(THREE, scene, game)   once after the 3D world is built (and after restart): add your own 3D objects
//   onKey(e, down, game)   first in the input chain; return true to consume the key
//   onTurnStart(turn, side, game), onPhase(phase, game), onEnd(result, game)
const GAME = {
  addons: [],
  builtinNumbers: true,        // false when an addon draws damage numbers
  units: [], turn: 1, phase: 'player', result: null, auto: false, frozen: false,
  tg: null,                    // the GameDNA_TacticsGrid3D instance (scene, camera, rules, anchors)
  overlay: { w: VW, h: VH },   // the 2D overlay canvas size in logical px; ctx is passed to draw / drawUI
  uiRectsExtra: {},

GAME.addClass = (id, def) => { if (!id || !def) return false; CLASS_NAME[id] = def.name || id; CLASS_DEF[id] = { look: GameDNA_TacticsGrid3D.LOOKS.includes(def.look) ? def.look : 'knight', attack: ['melee', 'arrow', 'bolt'].includes(def.attack) ? def.attack : 'melee' }; return true; };

  const need = ['id', 'name', 'cls', 'side', 'x', 'z', 'hp', 'atk', 'def', 'mv', 'jump', 'rng'];
  const miss = need.filter(k => def == null || def[k] == null); if (miss.length) { console.warn('GAME.addUnit: missing ' + miss.join(', ')); return false; }

GAME.unitById = id => GAME.units.find(u => u.id === id) || null;

GAME.anchorOf = (id) => { const a = GAME.tg && GAME.tg.anchorOf(id); if (!a) return null; return Object.assign(a, { top: a.top - 14 }); };  // top includes the HP bar
GAME.unitRects = () => GAME.units.filter(u => u.hp > 0).map(u => { const a = GAME.tg.anchorOf(u.id); return { id: u.id, x: a.left, y: a.top - 14, w: a.w, h: a.h + 14 }; });
GAME.setUIRect = (name, r) => { if (r) GAME.uiRectsExtra[name] = r; else delete GAME.uiRectsExtra[name]; };
GAME.uiRects = () => UI_RECTS.concat(Object.values(GAME.uiRectsExtra));
GAME.hitStop = (ms) => { hitStopMs = Math.max(hitStopMs, +ms || 0); };
GAME.shake = (px, ms) => { GAME.tg && GAME.tg.shake(px, ms); };
GAME.flash = (color, ms) => { flashFx = { color: color || '#ffffff', t: 0, ms: +ms || 160 }; };
let UI_RECTS = [], hitStopMs = 0, flashFx = null;

// ---------- 3. RULES ----------

const CRIT = 0.1;

GAME.forecastData = (attId, defId) => {

// THE HIT SITE: every HP change goes through here (attacks, counters, heals; addons call GAME.hit for poison etc.)

    kind: (CLASS_DEF[att.cls] || {}).attack,
    onImpact: () => applyHit(att, def, dmg, 'attack', crit),

}

// ---------- 4. BATTLEFIELD ----------
const glCanvas = document.getElementById('gl'), uiCanvas = document.getElementById('ui'), stage = document.getElementById('stage');
function makeBattlefield() {
  if (GAME.tg) return GAME.tg;
  const tg = GameDNA_TacticsGrid3D.create({
    canvas: glCanvas, overlay: uiCanvas, view: { w: VW, h: VH }, map: MAP, seed: SEED,
    params: { zoom: +Q.get('zoom') || 2, camStep: +Q.get('cam') || 0, light: Q.get('light') || 'day' },
    units: () => GAME.units.filter(u => u.hp > 0),
    onStep: ev => each('onMove', ev, GAME)

  GAME.tg = tg;
  return tg;
}
function placeUnits() {
  const tg = GAME.tg; tg.clearActors();
  GAME.units = ROSTER.map(r => Object.assign({}, r, { rng: r.rng.slice(), maxHp: r.hp, acted: false, moved: false }));
  for (const u of GAME.units) { if (!tg.passable(u.x, u.z)) console.warn('unit ' + u.id + ' stands on a blocked tile'); tg.addActor({ id: u.id, side: u.side, cls: lookOf(u.cls), x: u.x, z: u.z }); }
  for (const u of GAME.units) { const f = nearestFoe(u); if (f) tg.face(u.id, f.id); }  // everyone starts looking at the nearest foe

// ---------- 5. TURNS & AI ----------
let timers = [], mode = 'idle', sel = null, reach = null, menu = null, tgt = null, cursor = { x: 1, z: 7 }, threatAll = false, hoverThreat = null, banner = null, numbers = [], undo = null;

let simT = 0;
function setPhase(p) { GAME.phase = p; each('onPhase', p, GAME); }
function newGame() {
  rng = mulberry(SEED); timers = []; numbers = []; simT = 0; GAME.turn = 1; GAME.result = null; mode = 'idle'; sel = null; reach = null; menu = null; tgt = null; threatAll = false; hoverThreat = null; undo = null;
  hitStopMs = 0; flashFx = null; GAME.uiRectsExtra = {};
  placeUnits(); GAME.tg.clearOverlays(); cursor = { x: 1, z: 7 }; GAME.tg.setCursor(cursor.x, cursor.z);
  each('scene3d', THREE, GAME.tg.scene, GAME);
  startTurn('a');
}
function startTurn(side) {
  for (const u of GAME.units) { GAME.tg.setDim(u.id, false); if (u.side === side) { u.acted = false; u.moved = false; } }
  setPhase(side === 'a' ? 'player' : 'enemy');
  showBanner(side === 'a' ? 'PLAYER PHASE' : 'ENEMY PHASE', side === 'a' ? '#69b8ff' : '#ff7a66', 'Turn ' + GAME.turn);
  each('onTurnStart', GAME.turn, side, GAME);
  mode = 'banner';
  after(1150, () => {
    if (GAME.result) return;
    if (side === 'a') { mode = 'idle'; GAME.tg.setCursor(cursor.x, cursor.z); refreshOverlays(); if (GAME.auto) after(250, autoStep); }
    else { mode = 'busy'; after(150, () => runSide('b')); }
  });
}
function endTurn() {
  if (GAME.result) return;
  GAME.tg.clearOverlays(); sel = null; GAME.tg.setSelected(null); menu = null; tgt = null;
  if (GAME.phase === 'player') startTurn('b');
  else { GAME.turn++; if (GAME.turn > MAX_TURNS) return finish('TIME UP'); startTurn('a'); }
}
function checkEnd() {
  const a = GAME.alive().some(u => u.side === 'a'), b = GAME.alive().some(u => u.side === 'b');
  if (!b) { finish('VICTORY'); return true; } if (!a) { finish('DEFEAT'); return true; } return false;
}
function finish(result) {

  showBanner(result, result === 'VICTORY' ? '#ffd76a' : result === 'DEFEAT' ? '#ff6a5a' : '#d8d8e8', result === 'VICTORY' ? 'The terraces are held' : result === 'DEFEAT' ? 'The line has broken' : 'Neither side yields', true);

// distance field (walking cost to stand next to any foe), ignoring move points; used to approach
function approachField(u) {

// plan(u): the best {to, target} for this unit; shared by the enemy AI and autoplay. Deterministic.
function plan(u) {

function execute(u, p, done) {

    u.x = p.to.x; u.z = p.to.z; u.moved = true; each('onMove', { id: u.id, end: true, to: { x: u.x, z: u.z } }, GAME);
