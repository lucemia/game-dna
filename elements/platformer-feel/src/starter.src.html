if (T_AT !== null) {
  for (let n = Math.round(T_AT * 60 / 1000); n > 0; n--) step();
  draw(); document.documentElement.dataset.state = JSON.stringify(stateJSON());
}
if (!FREEZE) {
  addEventListener('keydown', e => { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); else if (AC.state === 'suspended') AC.resume(); } catch (er) { } onKeyDown(e); });
  addEventListener('keyup', onKeyUp);
  document.querySelectorAll('#pad button').forEach(b => { const k = b.dataset.k; b.addEventListener('pointerdown', e => { e.preventDefault(); virtualKey(k, true); }); ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, () => virtualKey(k, false))); });
  cv.addEventListener('pointerdown', () => { if (S.scene !== 'play') latched.jump = true; });
  let acc = 0, prev = null;
  const loop = now => { if (prev === null) prev = now; acc += Math.min(250, now - prev); prev = now; while (acc >= STEP_MS) { step(); acc -= STEP_MS; } draw(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else window.__frozen = true;
</script>
</body>
