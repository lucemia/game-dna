<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossroads Cup</title>
<style>
:root { --bg: #0c0b18; --ink: #dcd8f0; --dim: #8e88b4; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; min-height: 100vh; }
#stage { width: 100%; height: calc(100vh - 96px); min-height: 160px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 6px; overflow: hidden; }
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; max-width: 100%; }
#bar b { color: var(--ink); }
.pad { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.pad button { background: #221e40; color: var(--ink); border: 1px solid #3a3468; border-radius: 5px; padding: 6px 10px; font: inherit; touch-action: manipulation; }
@media (max-width: 760px) { #wrap { padding: 8px; } #stage { height: auto; min-height: 0; padding: 6px 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="240" height="160"></canvas></div>
  <div id="bar">
    <span><b>Crossroads Cup</b>: four moves, six types, three rivals.</span>
    <span>Arrows choose, Z / Enter confirm, X / Esc back, <b>P</b> auto play. <b>?auto=1</b> to watch, <b>?format=double</b> for 2v2.</span>
    <span class="pad"><button data-key="left" aria-label="Left">&#9664;</button><button data-key="up" aria-label="Up">&#9650;</button><button data-key="down" aria-label="Down">&#9660;</button><button data-key="right" aria-label="Right">&#9654;</button><button data-key="ok">A</button><button data-key="back">B</button><button data-key="auto">Auto</button></span>
  </div>
</div>

</html>
