<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windrider Post</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0d1c; color: #c8cce0; font: 13px/1.45 system-ui, sans-serif; }
  #wrap { max-width: 100vw; display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; touch-action: none; max-width: 100vw; }
  .hint { max-width: 768px; padding: 6px 12px; font-size: 12px; color: #8c92b0; text-align: center; }
  .hint b { color: #e8e2c8; font-weight: 600; }
  #pad { display: none; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  #pad button { font: 600 14px system-ui; min-width: 54px; min-height: 44px; border-radius: 8px; border: 1px solid #3a4070; background: #1c2040; color: #e8e2c8; }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="256" height="224"></canvas>
  <div id="pad">
    <button data-k="left">&#9664;</button><button data-k="up">&#9650;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button>
    <button data-k="ok">Z</button><button data-k="mount">X</button>
  </div>
  <p class="hint"><b>Walk</b>: arrows &middot; <b>X</b>: call the mount and take off &middot; <b>Fly</b>: left/right turn, up faster, down slower &middot; <b>Z</b>: land (flat ground only) &middot; <b>P</b>: autoplay &middot; <b>R</b>: restart</p>
</div>
