<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Caravan Ambush + Game DNA mix</title>
<style>
  html, body { margin: 0; height: 100%; background: #140d09; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="224"></canvas>
<script src="damage-pop.js"></script>
<script src="hit-stop-shake.js"></script>
<script src="hit-sparks.js"></script>
<script>
"use strict";
(() => {
  // ---------- boot & parameters ----------
  const W = 256, H = 224, STEP = 1000 / 60, PANEL_Y = 152;
  const qs = new URLSearchParams(location.search);
  const FREEZE_AT = qs.has("t") ? Math.max(0, Number(qs.get("t")) || 0) : null;
  const FROZEN = FREEZE_AT !== null && qs.get("freeze") === "1";
  const AUTO = qs.get("auto") === "1" || (FROZEN && qs.get("auto") !== "0");

  const canvas = document.getElementById("screen");
  const g = canvas.getContext("2d");
  g.imageSmoothingEnabled = false;
  function fitCanvas() {
    const k = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
    canvas.style.width = W * k + "px";
    canvas.style.height = H * k + "px";
  }
  addEventListener("resize", fitCanvas);
  fitCanvas();

  function seeded(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rand = seeded(20261114);
  const roll = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));

  // ---------- 3x5 bitmap font ----------
  const GLYPHS = {
    A: "25755", B: "65656", C: "34443", D: "65556", E: "74647", F: "74644", G: "34553", H: "55755",
    I: "72227", J: "11152", K: "55655", L: "44447", M: "57555", N: "65555", O: "25552", P: "65644",
    Q: "25573", R: "65655", S: "34216", T: "72222", U: "55557", V: "55552", W: "55575", X: "55255",
    Y: "55222", Z: "71247", 0: "75557", 1: "26227", 2: "61247", 3: "61216", 4: "55711", 5: "74616",
    6: "34757", 7: "71222", 8: "75757", 9: "75716", "!": "22202", ".": "00002", ":": "02020",
    "/": "11244", "-": "00700", "?": "61202", "'": "22000", ",": "00024", ">": "42124", "+": "02720",
  };
  function glyphs(str, x, y, col, sc) {
    g.fillStyle = col;
    for (const ch of String(str).toUpperCase()) {
      const gl = GLYPHS[ch];
      if (gl) for (let r = 0; r < 5; r++) {
        const bits = gl.charCodeAt(r) - 48;
        for (let c = 0; c < 3; c++) if (bits & (4 >> c)) g.fillRect(x + c * sc, y + r * sc, sc, sc);
      }
      x += 4 * sc;
    }
  }
  function say(str, x, y, col = "#fff", sc = 1, shade = "#1a1020") {
    if (shade) glyphs(str, x + sc, y + sc, shade, sc);
    glyphs(str, x, y, col, sc);
  }
  const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
  const sayMid = (s, y, col, sc) => say(s, Math.round((W - textW(s, sc)) / 2), y, col, sc);

  // ---------- pixel art ----------
  function bake(rows, pal, extra) {
    const w = Math.max(...rows.map(r => r.length));
    const mk = (mode) => {
      const c = document.createElement("canvas");
      c.width = w; c.height = rows.length;
      const cg = c.getContext("2d");
      rows.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
          const col = pal[row[x]];
          if (!col) continue;
          cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? greyOf(col) : col;
          cg.fillRect(x, y, 1, 1);
        }
      });
      if (extra) extra(cg, mode);
      return c;
    };
    return { normal: mk("normal"), white: mk("white"), grey: mk("grey"), w, h: rows.length };
  }
  function greyOf(hex) {
    const n = parseInt(hex.slice(1), 16);
    const v = Math.round((((n >> 16) & 255) * 0.3 + ((n >> 8) & 255) * 0.5 + (n & 255) * 0.2) * 0.6);
    return `rgb(${v},${v},${v + 8})`;
  }

  const HUMAN = [
    "......oooo......",
    ".....ohhhhoo....",
    "....ohhhhhhho...",
    "....ohsshhhho...",
    "....osesshhho...",
    "....osssshho....",
    ".....ossso......",
    "....obbllbbo....",
    "...obbblbbbdo...",
    "..osobbbbbbdo...",
    "..osobbbbbddo...",
    "..oo.obbbbddo...",
    "....oddddddo....",
    "....oppppppo....",
    "....opppoppo....",
    "....oppo.oppo...",
    "....oppo.oppo...",
    "...okkko.okkko..",
    "...oooo..oooo...",
  ];
  const ARMS = {
    sword(cg, mode) {
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#777" : "#dfe6f0";
      cg.fillRect(1, 1, 1, 8);
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#555" : "#8b5a2b";
      cg.fillRect(0, 9, 3, 1); cg.fillRect(1, 10, 1, 2);
    },
    staff(cg, mode) {
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#555" : "#7a4a24";
      cg.fillRect(1, 2, 1, 16);
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#888" : "#7fe3ff";
      cg.fillRect(0, 0, 3, 3);
      cg.fillStyle = mode === "normal" ? "#e6fbff" : cg.fillStyle;
      cg.fillRect(0, 0, 1, 1);
    },
    blade(cg, mode) {
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#777" : "#c9d2dc";
      cg.fillRect(0, 6, 1, 4); cg.fillRect(1, 5, 1, 1);
      cg.fillStyle = mode === "white" ? "#fff" : mode === "grey" ? "#555" : "#5a3a1e";
      cg.fillRect(0, 10, 2, 1);
    },
  };
  const BASE_PAL = { o: "#1a1020", s: "#eab58c", e: "#1a1020", p: "#5a4632", k: "#2e2218" };

  const HEROES = [
    { name: "Bram", hp: 104, mp: 10, atk: 15, mag: 5, def: 10, agi: 7, arm: "sword", spells: ["mend"],
      pal: { h: "#9aa0ad", b: "#3d63b8", l: "#86a8ec", d: "#25407a" } },
    { name: "Ivy", hp: 66, mp: 34, atk: 7, mag: 14, def: 5, agi: 9, arm: "staff", spells: ["ember", "gale", "mend"],
      pal: { h: "#d8a83c", b: "#7b3e9a", l: "#b67ad2", d: "#4a2060" } },
    { name: "Rusk", hp: 80, mp: 12, atk: 13, mag: 7, def: 7, agi: 13, arm: "blade", spells: ["ember"],
      pal: { h: "#6a3a1e", b: "#3f8a4a", l: "#78c47e", d: "#24582c" } },
  ];
  HEROES.forEach(h => { h.art = bake(HUMAN, Object.assign({}, BASE_PAL, h.pal), ARMS[h.arm]); });

  const SAND_EDGE = "#2a160c";
  const FOES = {
    beetle: { name: "Dune Beetle", hp: 62, atk: 13, def: 8, agi: 5, pal: { o: SAND_EDGE, c: "#3c7a78", l: "#7cc8b8", d: "#21464a", m: "#7a5a3a", s: "#5a3a2a", e: "#ffdf5a" }, rows: [
      "..........oooooo..........",
      ".......oooccccccooo.......",
      ".....oocclllcccccccoo.....",
      "....occllllcccccccccco....",
      "...occlllcccccccccccccoo..",
      "..occcllcccccccccccccddo..",
      "..occccccccccccccccccddoooo",
      ".occcccccccccccccccccddosso",
      ".ocddcccccccccccccccdddoseso",
      ".odddddcccccccccccddddoossso",
      ".oddddddddddddddddddddooooo.",
      "..oommmmmmmmmmmmmmmmmo.....",
      "...o.oo..oo..oo..oo.o......",
      "..oo.o..oo..oo..oo..oo.....",
      ".oo..o..o...o...o....o.....",
    ] },
    scorp: { name: "Dust Scorpion", hp: 48, atk: 15, def: 5, agi: 11, pal: { o: SAND_EDGE, t: "#c0603a", w: "#ffe0a0", b: "#d88a48", l: "#f6c27a", d: "#8a4a26", p: "#a84a2a", e: "#1a0808" }, rows: [
      "...ooo......................",
      "..ottto.....................",
      "..otwtoo....................",
      "...oottto...................",
      ".....ootto..................",
      "......otto..................",
      "......otto..................",
      ".......otto.................",
      "....ooooottooooooo.......oo.",
      "...obbbbbbbbbbbbbbo....ooppo",
      "..obblbbblbbblbbbbbo..oppppo",
      "..obbbbbbbbbbbbbbbbboooppoo.",
      "..odbbbbbbbbbbbbbbbebbbbo...",
      "...oddddddddddddddddddboooo.",
      "....ooooooooooooooooooo.oppo",
      "....o.o..o.o..o.o..o.o..ooo.",
      "...o..o.o..o.o..o.o...o.....",
      "..o...o.....................",
    ] },
    wyrm: { name: "Sand Wyrm", hp: 84, atk: 13, def: 6, agi: 8, breath: true, pal: { o: SAND_EDGE, c: "#b06a3a", l: "#e8a868", d: "#6e3a1e", e: "#fff27a", m: "#5a1010", w: "#f0e8d0", s: "#c89656" }, rows: [
      "........oooooo........",
      "......oocccccco.......",
      ".....occcccccccoo.....",
      ".....occceoccccmmo....",
      ".....occcccccccmwmo...",
      ".....oclllccccooooo...",
      "......oclllcco........",
      ".......ocllco.........",
      "........ocllco........",
      "........occllco.......",
      ".........occllco......",
      ".........occclco......",
      "........occcclco......",
      ".......occcccdco......",
      "......occcccddo.......",
      ".....occcccddo........",
      "...ooccccddddo........",
      "..occccdddddo.........",
      ".ossssssssssssoo......",
      "ossssssssssssssssoo...",
      ".ooooooooooooooooo....",
    ] },
    wisp: { name: "Glass Wisp", hp: 36, atk: 11, def: 3, agi: 14, drain: true, pal: { o: "#1d2a40", l: "#a8e8f0", w: "#ffffff", g: "#5aa8c8", e: "#1d2a40" }, rows: [
      "......oooo......",
      "....oolwwloo....",
      "...olwwwlllgo...",
      "..olwwlllllggo..",
      "..olwlllllllgo..",
      ".olllleollelggo.",
      ".olllllllllllgo.",
      ".ollllllllllggo.",
      "..olllllllllgo..",
      "..ogllllllllgo..",
      "...oggllllggo...",
      "....ooglgggo....",
      ".....olgo.oo....",
      "......oglo......",
      ".....ol.go......",
      "....o....o......",
    ] },
  };
  for (const k in FOES) FOES[k].art = bake(FOES[k].rows, FOES[k].pal);

  const WAVES = [["beetle", "scorp"], ["wisp", "beetle", "wyrm"], ["scorp", "wyrm", "wisp", "beetle"]];
  const SPELLS = {
    ember: { label: "Ember", cost: 3, aim: "foe" },
    gale: { label: "Gale", cost: 7, aim: "allFoes" },
    mend: { label: "Mend", cost: 4, aim: "hero" },
  };
  const FOE_SPOTS = [[80, 92], [40, 108], [86, 130], [44, 146]];

  // ---------- combatants ----------
  class Combatant {
    constructor(spec, side, slot) {
      this.spec = spec; this.side = side; this.slot = slot; this.name = spec.name;
      this.maxHp = this.hp = this.barHp = spec.hp;
      this.maxMp = this.mp = spec.mp || 0;
      this.atk = spec.atk; this.mag = spec.mag || 0; this.guard = spec.def; this.agi = spec.agi;
      this.braced = false; this.flash = 0; this.shove = 0; this.fade = 0;
    }
    get up() { return this.hp > 0; }
    get art() { return this.spec.art; }
    get x() { return this.side === "hero" ? 198 + this.slot * 8 : FOE_SPOTS[this.slot][0]; }
    get y() { return this.side === "hero" ? 82 + this.slot * 26 : FOE_SPOTS[this.slot][1]; }
    get id() { return this.side + this.slot; }
    centre() { return [this.x, this.y - this.art.h / 2]; }
    box() { const a = this.art; return [this.x - a.w / 2 - 3, this.y - a.h - 3, a.w + 6, a.h + 6]; }
  }

  // ---------- the battle ----------
  class Skirmish {
    constructor() {
      this.party = HEROES.map((h, i) => new Combatant(h, "hero", i));
      this.bag = { tonic: 4, ether: 2 };
      this.waveNo = 0;
      this.beginWave();
    }
    beginWave() {
      this.foes = WAVES[this.waveNo].map((k, i) => new Combatant(FOES[k], "foe", i));
      this.queue = []; this.actor = null; this.fx = null; this.caption = "";
      this.setPhase("banner");
    }
    setPhase(p) { this.phase = p; this.clock = 0; }
    everyone() { return [...this.party, ...this.foes]; }
    roundOrder() {
      return this.everyone().filter(c => c.up).sort((a, b) =>
        b.agi - a.agi || (a.side === b.side ? a.slot - b.slot : a.side === "hero" ? -1 : 1));
    }
    passTurn() {
      let next = null;
      while (!next) {
        if (!this.queue.length) this.queue = this.roundOrder();
        const c = this.queue.shift();
        if (c.up) next = c;
      }
      this.actor = next;
      next.braced = false;
      if (next.side === "hero") { this.menu = { stage: "root", idx: 0, sub: 0 }; this.setPhase("command"); }
      else this.setPhase("foeTurn");
    }
    update(input) {
      this.clock++;
      for (const c of this.everyone()) {
        if (c.flash > 0) c.flash--;
        if (c.barHp !== c.hp) c.barHp += Math.sign(c.hp - c.barHp) * Math.max(0.5, Math.abs(c.hp - c.barHp) / 8);
        if (Math.abs(c.barHp - c.hp) < 0.5) c.barHp = c.hp;
        if (!c.up && c.side === "foe" && c.fade < 30) c.fade++;
      }
      switch (this.phase) {
        case "banner": if (this.clock > 70) this.passTurn(); break;
        case "command": for (const ev of input) this.onCommandInput(ev); break;
        case "foeTurn": if (this.clock > 22) this.foeChooses(); break;
        case "act": this.stepAction(); break;
        case "cleared":
          if (input.some(e => e.k === "ok" || e.k === "tap")) {
            this.waveNo++;
            for (const h of this.party) {
              h.hp = h.up ? Math.min(h.maxHp, h.hp + 24) : Math.round(h.maxHp / 4);
              h.mp = Math.min(h.maxMp, h.mp + 6);
            }
            this.beginWave();
          }
          break;
      }
    }
    // --- player commands ---
    rootOptions() { return ["Strike", "Spell", "Brace", "Item"]; }
    listFor(stage) {
      if (stage === "spell") return this.actor.spec.spells.map(k => ({ key: k, label: SPELLS[k].label, note: String(SPELLS[k].cost), ok: this.actor.mp >= SPELLS[k].cost }));
      if (stage === "item") return [
        { key: "tonic", label: "Tonic", note: "x" + this.bag.tonic, ok: this.bag.tonic > 0 },
        { key: "ether", label: "Ether", note: "x" + this.bag.ether, ok: this.bag.ether > 0 },
      ];
      return this.rootOptions().map(l => ({ key: l.toLowerCase(), label: l, ok: true }));
    }
    targetsFor(aim) {
      if (aim === "foe" || aim === "allFoes") return this.foes.filter(f => f.up);
      return this.party.filter(h => h.up);
    }
    onCommandInput(ev) {
      const m = this.menu;
      if (ev.k === "tap") return this.onCommandTap(ev.x, ev.y);
      if (m.stage === "target") {
        const pool = this.targetsFor(m.aim);
        if (ev.k === "up" || ev.k === "left") m.sub = (m.sub + pool.length - 1) % pool.length;
        if (ev.k === "down" || ev.k === "right") m.sub = (m.sub + 1) % pool.length;
        if (ev.k === "ok") this.commit(m.order, m.aim === "allFoes" ? pool : [pool[m.sub]]);
        if (ev.k === "back") { m.stage = m.from; }
        return;
      }
      const list = this.listFor(m.stage);
      if (ev.k === "up") m.idx = (m.idx + list.length - 1) % list.length;
      if (ev.k === "down") m.idx = (m.idx + 1) % list.length;
      if (ev.k === "back" && m.stage !== "root") { m.stage = "root"; m.idx = m.stage === "root" ? m.rootIdx || 0 : 0; }
      if (ev.k === "ok") this.pick(list[m.idx]);
    }
    pick(opt) {
      const m = this.menu;
      if (!opt || !opt.ok) return;
      if (m.stage === "root") {
        m.rootIdx = m.idx;
        if (opt.key === "strike") return this.aim({ kind: "strike" }, "foe");
        if (opt.key === "brace") return this.commit({ kind: "brace" }, [this.actor]);
        m.stage = opt.key; m.idx = 0; return;
      }
      if (m.stage === "spell") return this.aim({ kind: "spell", spell: opt.key }, SPELLS[opt.key].aim);
      if (m.stage === "item") return this.aim({ kind: "item", item: opt.key }, "hero");
    }
    aim(order, aim) {
      const m = this.menu;
      m.from = m.stage; m.stage = "target"; m.order = order; m.aim = aim;
      const pool = this.targetsFor(aim);
      m.sub = aim === "hero" ? Math.max(0, pool.indexOf(this.actor)) : 0;
    }
    menuRowAt(x, y) {
      if (x < 6 || x > 66) return -1;
      const i = Math.floor((y - (PANEL_Y + 8)) / 11);
      return i >= 0 && i < this.listFor(this.menu.stage).length ? i : -1;
    }
    onCommandTap(x, y) {
      const m = this.menu;
      if (m.stage === "target") {
        const pool = this.targetsFor(m.aim);
        const hit = pool.findIndex(c => { const [bx, by, bw, bh] = c.box(); return x >= bx && x < bx + bw && y >= by && y < by + bh; });
        if (hit >= 0) { m.sub = hit; this.commit(m.order, m.aim === "allFoes" ? pool : [pool[hit]]); }
        else if (y >= PANEL_Y) m.stage = m.from;
        return;
      }
      const row = this.menuRowAt(x, y);
      if (row >= 0) { m.idx = row; this.pick(this.listFor(m.stage)[row]); }
      else if (y >= PANEL_Y && m.stage !== "root") m.stage = "root";
    }
    // --- enemy choice ---
    foeChooses() {
      const f = this.actor, living = this.party.filter(h => h.up);
      if (f.spec.breath && rand() < 0.34) return this.commit({ kind: "breath" }, living);
      const prey = living.slice().sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[rand() < 0.6 ? 0 : roll(0, living.length - 1)];
      this.commit({ kind: f.spec.drain && prey.mp > 0 && rand() < 0.4 ? "drain" : "bite" }, [prey]);
    }
    // --- resolving actions ---
    commit(order, targets) {
      const a = this.actor;
      order.targets = targets;
      if (order.kind === "spell") a.mp -= SPELLS[order.spell].cost;
      if (order.kind === "item") this.bag[order.item]--;
      this.caption = {
        strike: "Strike", brace: "Brace", bite: "Attack", breath: "Sand Breath", drain: "Mind Leech",
        spell: order.spell && SPELLS[order.spell].label, item: order.item && (order.item === "tonic" ? "Tonic" : "Ether"),
      }[order.kind];
      this.order = order;
      this.fx = { kind: order.kind === "spell" ? order.spell : order.kind === "item" ? order.item : order.kind, from: a, targets, t: 0 };
      this.setPhase("act");
    }
    stepAction() {
      const a = this.actor, t = this.clock;
      this.fx.t = t;
      const reach = ["strike", "bite"].includes(this.order.kind) ? 14 : 4;
      a.shove = t < 12 ? (t / 12) * reach : t < 30 ? reach : Math.max(0, reach * (1 - (t - 30) / 10));
      if (t === 20) this.landEffect(a, this.order);
      if (t >= 46) {
        a.shove = 0; this.fx = null; this.caption = "";
        if (this.foes.every(f => !f.up)) this.setPhase(this.waveNo + 1 >= WAVES.length ? "victory" : "cleared");
        else if (this.party.every(h => !h.up)) this.setPhase("defeat");
        else this.passTurn();
      }
    }
    landEffect(a, order) {
      const T = order.targets;
      switch (order.kind) {
        case "strike": case "bite": T.forEach(t => this.wound(t, a.atk * 2 - t.guard + roll(0, a.atk >> 1), a, "physical")); break;
        case "breath": T.forEach(t => this.wound(t, a.atk + roll(0, 6) - (t.guard >> 1), a, "physical", "fire")); break;
        case "drain": T.forEach(t => { const mp0 = t.mp; t.mp = Math.max(0, t.mp - roll(4, 8)); if (mp0 - t.mp > 0) dp.spawn(t.id, mp0 - t.mp, "mp", { type: "mana" }); this.wound(t, a.atk - (t.guard >> 1), a, "arcane"); }); break;
        case "brace": a.braced = true; break;
        case "spell":
          if (order.spell === "ember") T.forEach(t => this.wound(t, a.mag * 3 - (t.guard >> 1) + roll(0, 6), a, "fire", "fire"));
          if (order.spell === "gale") T.forEach(t => this.wound(t, a.mag * 2 - (t.guard >> 1) + roll(0, 4), a, "shock", "thunder"));
          if (order.spell === "mend") T.forEach(t => this.restore(t, a.mag * 3 + roll(10, 16)));
          break;
        case "item":
          if (order.item === "tonic") T.forEach(t => this.restore(t, 45));
          if (order.item === "ether") T.forEach(t => { const mp0 = t.mp; t.mp = Math.min(t.maxMp, t.mp + 15); t.flash = 10; if (t.mp > mp0) dp.spawn(t.id, t.mp - mp0, "heal", { type: "mana" }); });
          break;
      }
    }
    wound(target, amount, from, type, spell) {
      let dmg = Math.max(1, Math.round(amount));
      if (target.braced) dmg = Math.max(1, dmg >> 1);

    render(game);
  } else {
    let last = performance.now(), acc = 0;
    const loop = now => {
      acc += Math.min(250, now - last); last = now;
      while (acc >= STEP) { step(); acc -= STEP; }
      render(game);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
