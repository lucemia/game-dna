<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thistledown Acre</title>
<style>
:root { --bg: #10140c; --ink: #f4ead8; --dim: #b8ac8c; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; min-height: 100vh; }
#stage { width: 100%; max-width: 1600px; display: flex; align-items: center; justify-content: center; }
#screen { display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); touch-action: none; background: #000; image-rendering: pixelated; }
#bar { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; max-width: 100%; }
#bar b { color: var(--ink); }
#info { display: none; width: 100%; max-width: 640px; text-align: center; font-size: 13px; color: var(--ink); }
#info b { color: #ffe7b0; } #info .dim { color: var(--dim); }
@media (max-width: 760px) { #wrap { padding: 4px 4px 8px; gap: 4px; } #bar .keys { display: none; } #info { display: block; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="screen" width="960" height="540"></canvas></div>
  <div id="info" aria-live="polite"></div>
  <div id="bar">
    <span><b>Thistledown Acre</b>: tap a tile to walk there or work it; tap the hotbar to switch tools.</span>
    <span class="keys"><b>Arrows</b> walk (a tap turns), <b>Z</b> use the tool / ship / buy / sleep, <b>1-4</b> or <b>Tab</b> tools, <b>Q</b> next seed, <b>X</b> back, <b>P</b> auto play.</span>
  </div>
</div>
<script src="art/pixel-scene.js"></script>
<script>
/* GameDNA_FarmingPlots (G-04 farming plots, system) - one plain script, no dependencies, one global.
 *
 * A farm loop on a tile grid: till, plant, water, crops grow one step per watered night (in season), harvest, ship in a bin
 * (paid overnight), buy seeds at a stall, seasons wither out-of-season crops, a day clock from 6:00 to midnight with dusk and
 * night, seeded rain. A farmer who walks tile by tile with a 4-frame walk (arm swing), turns before stepping, faces the tile
 * he works and plays a raise / strike tool animation. A bot that plays through the same key path. Crops and tools are data.
 *
 *   var F = GameDNA_FarmingPlots.create({ seed, cols, rows, tile: 16, walkable(cx, cy), field: [[cx, cy], ...],
 *       spots: { bin: [cx, cy], shop: [cx, cy], bed: [cx, cy] }, start: [cx, cy, 'down'], params, onEvent, onEnd });
 *   F.update(16.67); F.key('left' | 'ok' | ...); F.drawSoil(ctx); F.sprites() -> [{y, draw(ctx)}]; F.drawFx(ctx);
 *   F.drawSky(ctx, viewRect); F.drawUI(ctx, {w, h});  (API in module/README.md)
 *
 * Deterministic: every rule and the bot read only the seed and the update() clock (no Math.random, no Date).
 * ASCII only. Works headless (node) for rule checks: drawing needs a document.

  // sickle | a function (ctx, x, y, size)), colors (metal, wood, accent), name shown on the hotbar.
  var TOOLS = {

    can: { name: 'Watering Can', action: 'water', area: [[1, 0]], ms: 300, icon: 'can', colors: ['#3a8a7a', '#5cb8a0', '#a8ecd8'] },

    ripe: function (crop, def) { return !!(crop && def && !crop.dead && crop.growth >= def.days); },
    inSeason: function (def, seasonId) { return !!def && def.seasons.indexOf(seasonId) >= 0; },
    // can a seed planted today ripen before its season (or the year) ends? daysLeft counts today (1 = the last day)

    // dawn: the night's growth. A crop grows one day when its plot was watered yesterday and it is in season today;

  game.step = function (n) { for (var i = 0; i < (n || 1); i++) tick(); };
  game.render = render;
  game.press = function (k) { keyQ.push(k); };
  game.tick = tick;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { if (!bootHolds) boot(); else bootWaiting = true; }); else setTimeout(function () { if (!bootHolds) boot(); else bootWaiting = true; }, 0);
})();

</script>
